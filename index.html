<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}</style>
<title>Ôn thi Miễn dịch – Sinh lý bệnh</title>
<style>
:root{
  /* Layout: one centered column, sticky header with exam tabs + progress, question cards, navigator grid at bottom */
  --bg:#f5f7f6; --surface:#ffffff; --fg:#17211e; --muted:#5d6b66; --line:#d9e0dd;
  --accent:#0f766e; --accent-soft:#d8efec; --ok:#15803d; --ok-soft:#dcf3e3; --bad:#b91c1c; --bad-soft:#fbe0e0;
  --font-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101614; --surface:#17201d; --fg:#e6efeb; --muted:#97a8a1; --line:#2a3733;
  --accent:#4fd1c5; --accent-soft:#16332f; --ok:#5ee08a; --ok-soft:#14301f; --bad:#ff8a8a; --bad-soft:#3a1b1b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101614; --surface:#17201d; --fg:#e6efeb; --muted:#97a8a1; --line:#2a3733;
  --accent:#4fd1c5; --accent-soft:#16332f; --ok:#5ee08a; --ok-soft:#14301f; --bad:#ff8a8a; --bad-soft:#3a1b1b; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.55;padding-inline:16px}
*{box-sizing:border-box}
.wrap{max-width:760px;margin:0 auto;padding-block:0 48px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;border-bottom:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
h1{font-size:1.05rem;margin:0 0 8px;font-weight:700;text-wrap:balance}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;color:var(--fg);font:inherit;font-size:.9rem;padding:8px 14px;cursor:pointer;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--bg);font-weight:600}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.spacer{flex:1}
.stat{font-family:var(--font-mono);font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:10px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:14px;scroll-margin-top:130px}
.q h2{font-size:1rem;font-weight:600;margin:0 0 12px;display:flex;gap:10px}
.q h2 .n{font-family:var(--font-mono);color:var(--accent);flex:none;font-variant-numeric:tabular-nums}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-size:.95rem;padding:10px 12px;border-radius:8px;cursor:pointer;min-width:0}
.opt .l{font-family:var(--font-mono);font-weight:700;flex:none;width:1.4em;color:var(--muted)}
.opt span:last-child{min-width:0;overflow-wrap:anywhere}
.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.ok .l{color:var(--ok)} .opt.bad .l{color:var(--bad)}
.opt:disabled{cursor:default;color:var(--fg)}
.note{font-size:.85rem;margin-top:10px;color:var(--muted)}
.note b{color:var(--ok)}
.nav{margin-top:24px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.nav h3{margin:0 0 10px;font-size:.95rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.grid a{display:flex;align-items:center;justify-content:center;height:40px;border:1px solid var(--line);border-radius:6px;font-family:var(--font-mono);font-size:.85rem;color:var(--fg);text-decoration:none;background:var(--bg);cursor:pointer;font-variant-numeric:tabular-nums}
.grid a.done{background:var(--accent-soft);border-color:var(--accent)}
.grid a.ok{background:var(--ok-soft);border-color:var(--ok)}
.grid a.bad{background:var(--bad-soft);border-color:var(--bad)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;font-size:.9rem;padding:9px 16px;border-radius:8px;cursor:pointer;min-height:40px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:600}
.result{display:none;margin-top:14px;padding:14px 16px;border-radius:10px;background:var(--accent-soft);border:1px solid var(--accent)}
.result.show{display:block}
.result strong{font-family:var(--font-mono);font-size:1.3rem}
.why{margin-top:8px;padding:8px 10px;border-radius:6px;background:var(--accent-soft);color:var(--fg);font-size:.9rem}
.retrybar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-top:12px;padding:10px 12px;border:1px solid var(--accent);border-radius:8px;background:var(--accent-soft);font-weight:600}
.why p{margin:0}
.why p+p{margin-top:6px}
.why .src{color:var(--muted);font-size:.8rem}
.why b{font-weight:600}
.hint{font-size:.85rem;color:var(--muted);margin:8px 0 0}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Ôn thi Miễn dịch – Sinh lý bệnh</h1>
  <div class="row">
    <div class="seg" role="group" aria-label="Chọn đề">
      <button id="e1" aria-pressed="true">Đề 1</button><button id="e2" aria-pressed="false">Đề 2</button>
    </div>
    <div class="seg" role="group" aria-label="Chế độ">
      <button id="m1" aria-pressed="true">Luyện tập</button><button id="m2" aria-pressed="false">Thi thử</button>
    </div>
    <span class="spacer"></span>
    <span class="stat" id="stat">0/60</span>
  </div>
  <div class="bar"><i id="bar"></i></div>
</header>
<p class="hint" id="hint"></p>
<p class="hint" id="saved" aria-live="polite"></p>
<div class="retrybar" id="retrybar" hidden><span id="retrytxt"></span><button class="btn" id="back" type="button">Về đề đầy đủ</button></div>
<div id="list"></div>
<div class="nav">
  <h3>Danh sách câu</h3>
  <div class="grid" id="grid"></div>
  <div class="row" style="margin-top:14px">
    <button class="btn primary" id="submit">Nộp bài</button>
    <button class="btn" id="retry">Làm lại câu sai</button>
    <button class="btn" id="reset">Làm lại</button>
    <button class="btn" id="shuf">Xáo trộn câu</button>
  </div>
  <div class="result" id="result" aria-live="polite"></div>
</div>
</div>
<script>
const DATA={"1": [{"q": "Tán huyết do tai biến truyền máu sai nhóm là quá mẫn loại mấy?", "o": ["Type I", "Type II", "Type III", "Type IV"], "a": 1, "e": "Truyền nhầm nhóm máu: kháng thể có sẵn (như kháng A, kháng B) gắn lên hồng cầu của người cho, hoạt hóa bổ thể gây tán huyết. Đây là quá mẫn type II (kháng thể độc tế bào).", "x": "Type I qua IgE (dị ứng), type III do phức hợp miễn dịch, type IV qua tế bào T.", "s": "Không có trong các slide đã gửi, giải thích theo kiến thức chung của môn"}, {"q": "Nồng độ natri máu bình thường?", "o": ["120 – 130 mmol/L", "135 – 145 mmol/L", "3 – 6 mmol/L", "3,5 – 5 mmol/L"], "a": 1, "e": "Natri máu bình thường là 135–145 mmol/L. Dưới 135 là hạ natri máu, trên 145 là tăng natri máu.", "x": "3,5–5 mmol/L là giá trị bình thường của kali máu.", "s": "Slide Mất cân bằng muối – nước"}, {"q": "Bệnh nhân xơ gan, nội soi thấy giãn tĩnh mạch thực quản. Cơ chế liên quan tăng áp lực tĩnh mạch cửa là gì?", "o": ["Ứ máu tĩnh mạch cửa, hình thành tuần hoàn bàng hệ cửa – chủ ở thực quản", "Giảm áp lực tĩnh mạch cửa", "Tăng tổng hợp albumin", "Co mạch tạng"], "a": 0, "e": "Xơ gan làm tăng áp lực tĩnh mạch cửa, máu ứ lại và tìm đường về tim qua tuần hoàn bàng hệ ngoài gan (tĩnh mạch thực quản, trĩ, tĩnh mạch dưới da bụng). Tĩnh mạch thực quản giãn nên dễ vỡ gây nôn ra máu.", "x": "Các phương án khác không mô tả đúng cơ chế tuần hoàn bàng hệ của tăng áp lực tĩnh mạch cửa.", "s": "Slide Sinh lý bệnh tiêu hóa – gan mật"}, {"q": "Phát biểu nào sau đây SAI về bệnh?", "o": ["Bệnh do thế lực siêu hình gây ra", "Bệnh là một trạng thái cân bằng mới kém ổn định", "Bệnh có nguyên nhân và điều kiện gây bệnh", "Bệnh là sự thay đổi cấu trúc và chức năng của cơ thể"], "a": 0, "e": "Bệnh là một quá trình có nguyên nhân cụ thể và giải thích được bằng khoa học. Quan niệm bệnh do thế lực siêu hình gây ra là duy tâm, nên phát biểu này sai.", "x": "Bệnh là trạng thái cân bằng mới kém ổn định so với trạng thái bình thường, đây là phát biểu đúng.", "s": "Không có trong các slide đã gửi, giải thích theo kiến thức chung của môn"}, {"q": "Sản phẩm của đáp ứng miễn dịch không phụ thuộc tuyến ức (kháng nguyên T-độc lập) là?", "o": ["IgM", "IgG", "IgA", "IgD"], "a": 0, "e": "Kháng nguyên không phụ thuộc tuyến ức (như polysaccharide) kích thích trực tiếp lympho B mà không cần Th, chủ yếu tạo IgM, không chuyển lớp và không có tế bào nhớ.", "x": "IgG, IgA và IgE là kết quả của chuyển lớp kháng thể, cần sự giúp đỡ của Th (phụ thuộc tuyến ức).", "s": "Slide Tế bào miễn dịch và cơ quan lympho"}, {"q": "Khát nước do cơ chế nào gây ra?", "o": ["Giảm áp suất thẩm thấu huyết tương", "Tăng áp suất thẩm thấu huyết tương", "Tăng nhạy cảm ADH", "Tăng thể tích huyết tương"], "a": 1, "e": "Tăng áp suất thẩm thấu huyết tương (hoặc giảm thể tích) kích thích trung tâm khát ở vùng dưới đồi, gây cảm giác khát (yếu tố quyết định lượng nước uống vào).", "x": "Giảm áp suất thẩm thấu huyết tương hay tăng thể tích huyết tương làm giảm khát.", "s": "Slide Mất cân bằng muối – nước"}, {"q": "Triệu chứng thần kinh do hạ natri máu là gì?", "o": ["Thiếu máu não thoáng qua", "Phù do dịch vào tế bào não", "Tăng áp suất thẩm thấu", "Tăng áp suất nội sọ do máu tụ"], "a": 1, "e": "Hạ natri máu làm giảm áp suất thẩm thấu ngoại bào, nước đi vào tế bào, gây phù tế bào não, từ đó có triệu chứng thần kinh (đau đầu, lú lẫn, co giật).", "x": "Hạ natri máu làm giảm chứ không tăng áp suất thẩm thấu. Thiếu máu não thoáng qua không phải cơ chế.", "s": "Slide Mất cân bằng muối – nước"}, {"q": "Bệnh nhân xơ gan, yếu tố nào gây hạ đường huyết đột ngột?", "o": ["Giảm đáp ứng tế bào gan với insulin", "Giảm dự trữ glycogen", "Tăng tổng hợp lipid", "Tăng hoạt hóa phó giao cảm"], "a": 1, "e": "Xơ gan nặng làm giảm dự trữ glycogen và giảm tân tạo glucose, nên dễ hạ đường huyết đột ngột, làm nặng thêm bệnh não gan.", "x": "Giảm đáp ứng của tế bào gan với insulin xảy ra ở giai đoạn đầu và gây tăng đường huyết, không phải hạ đường huyết. Tăng tổng hợp lipid dẫn đến gan nhiễm mỡ.", "s": "Slide Sinh lý bệnh tiêu hóa – gan mật"}, {"q": "Tiêu chuẩn chẩn đoán thiếu máu?", "o": ["Giảm hồng cầu và/hoặc hemoglobin", "Niêm mạc nhạt và chóng mặt", "Đau đầu, buồn nôn", "Mệt mỏi, hồi hộp"], "a": 0, "e": "Thiếu máu được định nghĩa là giảm số lượng hồng cầu và/hoặc hemoglobin. Cơ chế là mất cân bằng giữa quá trình tạo và hủy hồng cầu.", "x": "Niêm nhạt, chóng mặt, đau đầu, buồn nôn chỉ là triệu chứng, không phải tiêu chuẩn chẩn đoán.", "s": "Slide Hội chứng thiếu máu"}, {"q": "pH = 7,25; pCO2 = 52 mmHg; HCO3- = 24 mmol/L. Rối loạn acid–base nào?", "o": ["Toan chuyển hóa", "Toan hô hấp", "Kiềm chuyển hóa", "Kiềm hô hấp"], "a": 1, "e": "pH 7,25 là toan. pCO2 tăng (52) còn HCO3- bình thường (24): toan hô hấp.", "x": "Toan chuyển hóa cần HCO3- giảm, ở đây HCO3- bình thường. Kiềm thì pH phải trên 7,45.", "s": "Không có trong các slide đã gửi, giải thích theo kiến thức chung của môn"}, {"q": "Nồng độ hemoglobin thấp gây ảnh hưởng tới quá trình hô hấp nào?", "o": ["Vận chuyển khí, trao đổi O2 trong mô", "Vận chuyển khí, khuếch tán", "Thông khí, khuếch tán", "Khuếch tán, trao đổi O2 trong mô"], "a": 1, "e": "Theo đáp án được đánh dấu trong đề R23: hemoglobin chở O2 trong máu nên Hb thấp làm giảm vận chuyển khí, và ảnh hưởng đến quá trình khuếch tán O2 từ phế nang vào máu.", "x": "Thông khí là quá trình đưa không khí ra vào phổi, không phụ thuộc nồng độ Hb. Các phương án có \"thông khí\" nên bị loại. Phương án \"vận chuyển khí, trao đổi O2 trong mô\" không phải đáp án mà đề đánh dấu.", "s": "Không có trong các slide đã gửi, giải thích theo kiến thức chung của môn"}, {"q": "Cấu trúc của insulin?", "o": ["2 chuỗi polypeptide liên kết disulfua", "2 chuỗi polypeptide liên kết hydro", "1 chuỗi polypeptide nội bào", "3 chuỗi polypeptide liên kết ion"], "a": 0, "e": "Insulin gồm 2 chuỗi polypeptide A và B nối nhau bằng cầu nối disulfua.", "x": "Insulin không phải 1 hay 3 chuỗi, và liên kết giữa hai chuỗi là cầu disulfua chứ không phải hydro hay ion.", "s": "Không có trong các slide đã gửi, giải thích theo kiến thức chung của môn"}, {"q": "Cơ chế nào điều hòa đáp ứng miễn dịch dịch thể liên quan đến mảnh Fc?", "o": ["Ức chế sản xuất kháng thể nhờ thụ thể FcR trên lympho B", "Phong tỏa và ức chế kháng nguyên gắn vào kháng thể màng", "Trung hòa và loại bỏ kháng nguyên bằng cơ chế opsonin hóa", "Các lympho B tự chết theo chương trình sau khi sản xuất kháng thể"], "a": 0, "e": "Kháng thể IgG gắn kháng nguyên thành phức hợp, phần Fc của kháng thể gắn vào thụ thể FcγRIIB trên lympho B và gửi tín hiệu ức chế, làm giảm sản xuất kháng thể. Đây là cơ chế điều hòa ngược âm tính liên quan đến mảnh Fc.", "x": "Opsonin hóa là chức năng của phần Fc nhưng nhằm loại bỏ kháng nguyên, không phải điều hòa đáp ứng. Phong tỏa kháng nguyên gắn vào kháng thể màng liên quan phần Fab. Apoptosis của lympho B không phải cơ chế qua Fc.", "s": "Không có trong các slide đã gửi, giải thích theo kiến thức chung của môn"}, {"q": "Tác dụng chính của Th17?", "o": ["Hoạt hóa đại thực bào viêm", "Hoạt hóa neutrophil", "Kích thích tế bào Mast", "Kích thích lympho"], "a": 1, "e": "Th17 tiết IL-17, thu hút và hoạt hóa neutrophil, bảo vệ chống vi khuẩn và nấm ngoại bào.", "x": "Hoạt hóa đại thực bào là chức năng của Th1, kích thích tế bào Mast không phải chức năng chính, kích thích lympho là chức năng chung của nhiều tế bào T.", "s": "Không có trong các slide đã gửi, giải thích theo kiến thức chung của môn"}, {"q": "Một người đàn ông 80 kg, lượng nước trong toàn bộ tế bào là bao nhiêu?", "o": ["48 L", "32 L", "4 L", "16 L"], "a": 1, "e": "Nam giới có khoảng 60% cân nặng là nước. Nước trong tế bào (nội bào) chiếm khoảng 40% cân nặng: 80 kg × 40% = 32 L. Nước ngoại bào khoảng 20% cân nặng (16 L), trong đó gian bào 15% và nội mạch 5%.", "x": "48 L là tổng lượng nước toàn cơ thể. 16 L là nước ngoại bào. 4 L là nước nội mạch (huyết tương).", "s": "Slide Mất cân bằng muối – nước"}, {"q": "Cơ quan lympho trung ương là?", "o": ["Tủy xương", "Hạch", "Lách", "Mảng Peyer"], "a": 0, "e": "Cơ quan lympho trung ương là nơi lympho bào biệt hóa và trưởng thành khi chưa tiếp xúc kháng nguyên lạ: tủy xương và tuyến ức (thymus).", "x": "Hạch, lách và mô lympho dưới niêm mạc (mảng Peyer) là cơ quan lympho ngoại vi, nơi lympho tiếp xúc kháng nguyên lạ.", "s": "Slide Tế bào miễn dịch và cơ quan lympho"}, {"q": "pH = 7,33; HCO3- = 20 mmol/L; pCO2 = 40 mmHg. Rối loạn acid–base nào?", "o": ["Toan chuyển hóa", "Toan hô hấp", "Kiềm chuyển hóa", "Kiềm hô hấp"], "a": 0, "e": "pH 7,33 là toan nhẹ. HCO3- giảm (20, bình thường 22–26), pCO2 bình thường (40): toan chuyển hóa.", "x": "Toan hô hấp cần pCO2 tăng, ở đây pCO2 bình thường. Kiềm thì pH phải trên 7,45.", "s": "Không có trong các slide đã gửi, giải thích theo kiến thức chung của môn"}, {"q": "Chất nào được dùng để đánh giá độ lọc cầu thận trên lâm sàng?", "o": ["Albumin", "Inulin", "Creatinin", "Insulin"], "a": 2, "e": "Creatinin được lọc tự do ở cầu thận và gần như không hấp thu, nên dùng để đánh giá độ lọc cầu thận trên lâm sàng. Inulin là chuẩn lý tưởng nhưng khó dùng thường quy.", "x": "Albumin bình thường không lọc qua cầu thận, insulin là hormone.", "s": "Không có trong các slide đã gửi, giải thích theo kiến thức chung của môn"}, {"q": "Bệnh nhân tiêm vaccine COVID-19 lần thứ 4, xuất hiện kháng thể kháng huyết thanh và phản ứng Arthus. Đây là quá mẫn loại nào?", "o": ["Type I", "Type II", "Type III", "Type IV"], "a": 2, "e": "Phản ứng Arthus xảy ra khi tiêm nhắc lại nhiều lần. Lúc này cơ thể đã có nhiều kháng thể IgG, kháng nguyên mới tiêm gặp kháng thể tại chỗ tạo phức hợp miễn dịch, lắng đọng ở thành mạch, hoạt hóa bổ thể và kéo neutrophil đến gây viêm, hoại tử. Đây là quá mẫn type III (phức hợp miễn dịch).", "x": "Type I là dị ứng tức thì qua IgE, type II là kháng thể gắn vào tế bào (như truyền sai nhóm máu), type IV là quá mẫn muộn qua tế bào T (như viêm da tiếp xúc).", "s": "Không có trong các slide đã gửi, giải thích theo kiến thức chung của môn"}, {"q": "Hormone do thận sản xuất kích thích tạo hồng cầu là?", "o": ["Erythropoietin", "Renin", "Aldosterone", "Calcitriol"], "a": 0, "e": "Erythropoietin (EPO) do thận sản xuất khi thiếu O2, kích thích tủy xương tạo hồng cầu. Suy thận mạn thiếu EPO gây thiếu máu.", "x": "Renin, aldosterone, calcitriol không kích thích tạo hồng cầu.", "s": "Slide Hội chứng thiếu máu"}, {"q": "Thiếu máu nhược sắc hồng cầu nhỏ có thể gặp ở bệnh lý nào?", "o": ["Thiếu máu do bất sản tủy", "Thiếu máu thiếu sắt", "Thiếu máu xuất huyết", "Thiếu máu thiếu vitamin B12"], "a": 1, "e": "Thiếu sắt làm tổng hợp hemoglobin giảm, gây thiếu máu nhược sắc, hồng cầu nhỏ (MCV, MCH, MCHC giảm), kèm sắt huyết thanh và ferritin giảm.", "x": "Thiếu vitamin B12 và folic acid gây hồng cầu to. Mất máu cấp thường đẳng sắc, đẳng bào. Bất sản tủy là giảm sản xuất do tủy tổn thương, không đặc trưng nhược sắc hồng cầu nhỏ.", "s": "Slide Hội chứng thiếu máu"}, {"q": "Đáp ứng B có sự hỗ trợ của tế bào Th, chuyển lớp kháng thể (IgM → IgG, IgA, IgE), tạo tế bào B nhớ. Kháng nguyên thuộc loại nào?", "o": ["Protein", "Hapten", "Lipid", "Carbohydrate"], "a": 0, "e": "Đáp ứng cần tế bào Th, có chuyển lớp từ IgM sang IgG/IgA/IgE và tạo tế bào B nhớ là đáp ứng phụ thuộc tuyến ức, đặc trưng của kháng nguyên protein.", "x": "Hapten phải gắn với chất mang protein mới kích thích đáp ứng. Lipid và carbohydrate thường là kháng nguyên không phụ thuộc tuyến ức.", "s": "Slide Tế bào miễn dịch và cơ quan lympho"}, {"q": "Sinh lý bệnh KHÔNG có tính chất nào sau đây?", "o": ["Tính tổng hợp", "Tính tích hợp", "Tính thực nghiệm", "Tính duy tâm"], "a": 3, "e": "Sinh lý bệnh có tính tổng hợp, tích hợp và thực nghiệm. Tính duy tâm không phải tính chất của môn khoa học này.", "x": "Ba tính chất còn lại là đúng.", "s": "Không có trong các slide đã gửi, giải thích theo kiến thức chung của môn"}, {"q": "Nhiễm ký sinh trùng đặc trưng bởi tăng loại bạch cầu nào?", "o": ["Bạch cầu trung tính", "Bạch cầu ái toan", "Bạch cầu ái kiềm", "Bạch cầu đơn nhân"], "a": 1, "e": "Nhiễm ký sinh trùng (nhất là giun sán) làm tăng bạch cầu ái toan. Bạch cầu ái toan đề kháng chống ký sinh trùng, diệt ký sinh trùng được bao bởi kháng thể.", "x": "Bạch cầu trung tính tăng trong nhiễm khuẩn. Bạch cầu ái kiềm liên quan phản ứng dị ứng. Bạch cầu đơn nhân là tế bào thực bào và trình diện kháng nguyên.", "s": "Slide Miễn dịch bẩm sinh"}, {"q": "Đột biến gen CD40 ảnh hưởng trực tiếp đến quá trình nào?", "o": ["Trình diện kháng nguyên của lympho B", "Hoạt hóa lympho B phụ thuộc tuyến ức", "Hoạt hóa độc tế bào của lympho B", "Chọn lọc âm tính ở tuyến ức"], "a": 1, "e": "CD40 trên lympho B gắn CD40L của Th. Đột biến CD40 làm mất hoạt hóa lympho B phụ thuộc tuyến ức, gây thiếu hụt chuyển lớp kháng thể (tăng IgM, giảm IgG, IgA, IgE).", "x": "Trình diện kháng nguyên và chọn lọc ở tuyến ức không phụ thuộc trực tiếp vào CD40.", "s": "Không có trong các slide đã gửi, giải thích theo kiến thức chung của môn"}, {"q": "Xét nghiệm nào xác định bệnh nhân bị viêm da tiếp xúc?", "o": ["Test lẩy da", "Test áp da", "Xét nghiệm IgE huyết thanh toàn phần", "Xét nghiệm IgE đặc hiệu"], "a": 1, "e": "Viêm da tiếp xúc là quá mẫn type IV (muộn, qua tế bào T). Test áp da đặt chất nghi ngờ lên da, đọc kết quả sau 48–72 giờ để xác định dị nguyên gây viêm da tiếp xúc.", "x": "Test lẩy da và IgE huyết thanh dùng cho quá mẫn type I qua IgE, không phù hợp với type IV.", "s": "Không có trong các slide đã gửi, giải thích theo kiến thức chung của môn"}, {"q": "Vì sao bệnh nhân tiểu đường chậm lành vết thương? (ngoại trừ)", "o": ["Tự miễn", "Môi trường đường huyết cao thuận lợi cho vi khuẩn phát triển", "Giảm khả năng thực bào của bạch cầu đa nhân", "Cơ địa dễ nhiễm khuẩn"], "a": 0, "e": "Tự miễn không phải cơ chế chủ yếu làm vết thương ở bệnh nhân tiểu đường chậm lành, nên đây là đáp án cần chọn trong câu hỏi \"ngoại trừ\".", "x": "Ba cơ chế còn lại đều đúng: đường huyết cao thuận lợi cho vi khuẩn phát triển, giảm khả năng thực bào của bạch cầu đa nhân, cơ địa dễ nhiễm khuẩn.", "s": "Không có trong các slide đã gửi, giải thích theo kiến thức chung của môn"}, {"q": "Quá trình chọn lọc clone diễn ra khi lympho trưởng thành tương tác với yếu tố nào?", "o": ["Cytokine", "Kháng nguyên đặc hiệu", "Tế bào trình diện kháng nguyên", "Yếu tố hóa hướng động"], "a": 1, "e": "Chọn lọc clone: kháng nguyên đặc hiệu chọn đúng clone lympho có thụ thể phù hợp để tăng sinh và biệt hóa thành tế bào hiệu quả và tế bào nhớ.", "x": "Cytokine, tế bào trình diện kháng nguyên và chất hóa hướng động hỗ trợ đáp ứng nhưng không phải yếu tố chọn clone.", "s": "Slide Tế bào miễn dịch và cơ quan lympho"}, {"q": "Tỷ lệ % lipid trong chylomicron (theo thứ tự triglyceride : cholesterol : phospholipid)?", "o": ["95 : 2 : 3", "50 : 25 : 25", "25 : 25 : 50", "10 : 45 : 45"], "a": 0, "e": "Chylomicron vận chuyển lipid từ thức ăn nên chủ yếu là triglyceride (khoảng 90–95%), cholesterol và phospholipid chỉ chiếm vài phần trăm. Vì vậy tỷ lệ 95 : 2 : 3 là đúng.", "x": "Các tỷ lệ 50 : 25 : 25 hoặc 25 : 25 : 50 là thành phần của lipoprotein khác (như LDL, HDL), không phải chylomicron.", "s": "Không có trong các slide đã gửi, giải thích theo kiến thức chung của môn"}, {"q": "pH = 7,30; pCO2 = 50 mmHg; HCO3- = 24 mmol/L. Rối loạn acid–base nào?", "o": ["Toan chuyển hóa", "Toan hô hấp", "Kiềm chuyển hóa", "Kiềm hô hấp"], "a": 1, "e": "pH 7,30 là toan. pCO2 tăng (50, bình thường 35–45), HCO3- bình thường (24), nguyên nhân là ứ CO2: toan hô hấp.", "x": "Toan chuyển hóa cần HCO3- giảm. Kiềm thì pH phải trên 7,45.", "s": "Không có trong các slide đã gửi, giải thích theo kiến thức chung của môn"}, {"q": "Hệ đệm bicarbonat trung hòa base mạnh bằng cách nào?", "o": ["Tạo ra base yếu", "Tạo ra acid yếu", "Tạo muối base", "Tạo muối trung tính"], "a": 0, "e": "Hệ đệm bicarbonat gồm H2CO3 (acid yếu) và NaHCO3 (muối base). Khi gặp base mạnh như NaOH, H2CO3 phản ứng tạo NaHCO3 và nước. Base mạnh được thay bằng base yếu nên pH ít thay đổi.", "x": "Hệ đệm không tạo acid yếu để trung hòa base. Sản phẩm chính là muối bicarbonat (base yếu), không phải muối trung tính.", "s": "Không có trong các slide đã gửi, giải thích theo kiến thức chung của môn"}, {"q": "Huyết áp 150/80 mmHg được phân loại là gì?", "o": ["Tăng huyết áp giai đoạn 1", "Tăng huyết áp giai đoạn 2", "Tiền tăng huyết áp", "Bình thường"], "a": 0, "e": "Theo phân loại JNC VII: tâm thu 150 nằm trong khoảng 140–159, nên thuộc giai đoạn 1. Khi tâm thu và tâm trương thuộc hai mức khác nhau, lấy mức cao hơn.", "x": "Giai đoạn 2 cần tâm thu từ 160 hoặc tâm trương từ 100 trở lên.", "s": "Slide Rối loạn tuần hoàn"}, {"q": "Bản chất của kháng thể là gì?", "o": ["Globulin", "Glycoprotein", "Albumin", "Lipoprotein"], "a": 0, "e": "Theo đáp án được đánh dấu trong đề R23, kháng thể thuộc nhóm globulin miễn dịch (immunoglobulin), nằm ở phân đoạn gamma globulin khi điện di huyết thanh.", "x": "Albumin và lipoprotein là các protein huyết tương khác, không phải kháng thể. Glycoprotein đúng về hóa học (immunoglobulin có gắn carbohydrate), nhưng đề đã đánh dấu Globulin là đáp án.", "s": "Không có trong các slide đã gửi, giải thích theo kiến thức chung của môn"}, {"q": "Bệnh nhân nghiện rượu bị loét dạ dày, đau vùng thượng vị. Cơ chế?", "o": ["Mất cân bằng giữa yếu tố tấn công và bảo vệ", "Tăng hệ đệm bicarbonat và tiết nhầy bảo vệ niêm mạc", "Tăng tái tạo tế bào do prostaglandin và TGF", "Tăng tưới máu dưới niêm"], "a": 0, "e": "Loét dạ dày là hậu quả mất cân bằng giữa yếu tố tấn công (rượu, NSAID, H. pylori, HCl, pepsin) và yếu tố bảo vệ (chất nhầy, bicarbonate, prostaglandin, tưới máu niêm mạc), trong đó yếu tố tấn công ưu thế.", "x": "Các phương án còn lại đều mô tả yếu tố bảo vệ tăng, trái với cơ chế gây loét.", "s": "Slide Sinh lý bệnh tiêu hóa – gan mật"}, {"q": "Yếu tố nào KHÔNG thuộc nhóm bảo vệ niêm mạc dạ dày?", "o": ["Chất nhầy, bicarbonate bảo vệ niêm mạc", "Pepsin, HCl do tế bào chính và tế bào thành tiết ra", "Mạch máu, oxy dưới niêm mạc", "Prostaglandin giúp tái tạo mô"], "a": 1, "e": "Pepsin và HCl (do tế bào chính và tế bào thành tiết ra) là yếu tố tấn công, không phải yếu tố bảo vệ.", "x": "Chất nhầy, bicarbonate, prostaglandin, mạch máu và oxy dưới niêm mạc đều là yếu tố bảo vệ.", "s": "Slide Sinh lý bệnh tiêu hóa – gan mật"}, {"q": "Thuốc ức chế lysosome (ví dụ hydroxychloroquine) ức chế bệnh tự miễn theo cơ chế nào?", "o": ["Ức chế quá trình trình diện kháng nguyên qua MHC II", "Ức chế hoạt hóa lympho T", "Ức chế sản xuất IgE", "Ức chế bổ thể"], "a": 0, "e": "Hydroxychloroquine làm tăng pH trong lysosome, ức chế enzym xử lý kháng nguyên, cản trở việc trình diện kháng nguyên qua MHC lớp II cho lympho T, nhờ đó giảm bệnh tự miễn.", "x": "Ức chế hoạt hóa lympho T là hậu quả gián tiếp chứ không phải cơ chế trực tiếp qua lysosome.", "s": "Không có trong các slide đã gửi, giải thích theo kiến thức chung của môn"}, {"q": "Nạn nhân tai nạn chảy máu nhiều; việc truyền máu nhanh chóng giúp phòng ngừa loại suy thận cấp nào?", "o": ["Suy thận cấp tại thận", "Suy thận cấp sau thận", "Suy thận cấp trước thận", "Suy thận mạn"], "a": 2, "e": "Mất máu nhiều làm giảm thể tích tuần hoàn và giảm tưới máu thận. Truyền máu nhanh giúp phục hồi tưới máu, phòng suy thận cấp trước thận (suy thận cấp chức năng do giảm tưới máu).", "x": "Suy thận cấp tại thận là tổn thương nhu mô thận. Suy thận cấp sau thận là do tắc nghẽn đường tiểu.", "s": "Không có trong các slide đã gửi, giải thích theo kiến thức chung của môn"}, {"q": "Giảm protein máu gây phù chủ yếu do cơ chế nào?", "o": ["Giảm áp suất keo", "Tăng áp suất thủy tĩnh", "Tăng tính thấm thành mạch", "Tắc nghẽn bạch mạch"], "a": 0, "e": "Giảm protein máu (nhất là albumin) làm giảm áp suất keo huyết tương, nước thoát ra mô kẽ nhiều hơn quay về mạch nên gây phù.", "x": "Tăng áp suất keo thì nước giữ lại trong mạch, không gây phù.", "s": "Slide Mất cân bằng muối – nước"}, {"q": "Thành phần nào của miễn dịch bẩm sinh nhưng liên quan mật thiết với miễn dịch thích nghi?", "o": ["Tế bào Mast", "Đại thực bào", "Lympho T", "Bạch cầu trung tính"], "a": 1, "e": "Đại thực bào thuộc miễn dịch bẩm sinh (thực bào mạnh) nhưng còn xử lý và trình diện kháng nguyên cho lympho T, và tiết cytokine (IL-1, TNF), nên liên quan chặt chẽ với miễn dịch thích nghi.", "x": "Tế bào Mast, bạch cầu trung tính chủ yếu thực hiện chức năng bẩm sinh. Lympho T thuộc miễn dịch thích nghi.", "s": "Slide Miễn dịch bẩm sinh"}, {"q": "Tình trạng nào sau đây làm tăng thông khí?", "o": ["Giảm PaCO2", "Giảm PaO2", "Tăng pH máu", "Tăng PaO2"], "a": 1, "e": "Giảm PaO2 kích thích thụ thể hóa học ngoại vi làm tăng thông khí (tăng nhịp và biên độ thở).", "x": "Tăng PaO2 và tăng pH máu làm giảm thông khí. Giảm PaCO2 cũng làm giảm kích thích hô hấp.", "s": "Không có trong các slide đã gửi, giải thích theo kiến thức chung của môn"}, {"q": "Tế bào T độc (CTL) nhận diện và tiêu diệt tế bào nhiễm vi sinh vật nội bào thông qua phân tử nào?", "o": ["MHC I", "MHC II", "Thụ thể Fc", "Thụ thể bổ thể"], "a": 0, "e": "Tế bào T độc (CD8+) nhận diện kháng nguyên trình diện trên MHC lớp I, đặc biệt kháng nguyên của vi sinh vật nội bào, rồi tiêu diệt tế bào nhiễm.", "x": "MHC lớp II trình diện kháng nguyên cho T hỗ trợ CD4. Thụ thể Fc là của các tế bào gắn kháng thể (như NK, đại thực bào).", "s": "Slide Tế bào miễn dịch và cơ quan lympho"}, {"q": "Tế bào Mast có đặc điểm nào sau đây?", "o": ["Có thể được hoạt hóa bởi nọc độc rắn, ong", "Giải phóng histamin gây co mạch", "Chỉ hiện diện trong lòng mạch máu", "Không liên quan đến dị ứng"], "a": 0, "e": "Tế bào Mast mang IgE trên bề mặt qua thụ thể FcεRI, nằm nhiều ở mô dưới niêm mạc, và có thể được hoạt hóa bởi nhiều tác nhân (dị nguyên, bổ thể C3a/C5a, chấn thương, nọc độc rắn, ong) rồi phóng hạt giải phóng histamin.", "x": "Histamin gây giãn mạch và tăng tính thấm, không gây co mạch. Tế bào Mast nằm trong mô chứ không chỉ trong mạch máu. Tế bào này liên quan chặt chẽ đến dị ứng.", "s": "Slide Miễn dịch bẩm sinh"}, {"q": "Lưu bệnh nhân sốc phản vệ thêm 24 giờ tại bệnh viện để làm gì?", "o": ["Kiểm tra và điều trị nếu xảy ra sốc phản vệ lần 2", "Điều tra nguyên nhân gây phản vệ", "Chữa trị suy hô hấp", "Chờ kết quả test lẩy da"], "a": 0, "e": "Sốc phản vệ có thể tái phát dạng hai pha: triệu chứng quay lại sau vài giờ, thường trong 24 giờ, dù đã hết. Vì vậy phải theo dõi để phát hiện và xử trí kịp thời sốc phản vệ lần 2.", "x": "Điều tra nguyên nhân và điều trị suy hô hấp có thể làm nhưng không phải lý do chính của việc giữ lại 24 giờ.", "s": "Không có trong các slide đã gửi, giải thích theo kiến thức chung của môn"}, {"q": "Triệu chứng lâm sàng thường gặp nhất của hội chứng thận hư?", "o": ["Tăng huyết áp và giảm albumin máu", "Phù và tiểu máu đại thể", "Phù và đạm niệu > 3 g/24h", "Toan chuyển hóa"], "a": 2, "e": "Hội chứng thận hư đặc trưng bởi phù, đạm niệu nhiều (trên ngưỡng 3–3,5 g/24h), giảm albumin máu và tăng lipid máu.", "x": "Tăng huyết áp không bắt buộc. Tiểu máu đại thể không phải đặc trưng. Toan chuyển hóa không phải triệu chứng thường gặp nhất.", "s": "Không có trong các slide đã gửi, giải thích theo kiến thức chung của môn"}, {"q": "Cái nào KHÔNG phải là nguyên nhân của cao huyết áp do rối loạn nội tiết?", "o": ["U tuyến giáp lành tính", "U tuyến thượng thận", "Hội chứng Cushing", "Hội chứng Crohn"], "a": 0, "e": "Theo slide, tăng huyết áp do rối loạn nội tiết gồm: u tủy thượng thận (tăng epinephrine, norepinephrine), u vỏ thượng thận (hội chứng Conn, tăng aldosterone) và hội chứng Cushing. U tuyến giáp lành tính không thuộc danh sách này, và đề R24 đánh dấu đây là đáp án.", "x": "Ba phương án còn lại là nguyên nhân nội tiết đã nêu trong slide. Lưu ý Crohn là bệnh tiêu hóa nên cũng không phải nguyên nhân nội tiết, câu này đề ra chưa chặt.", "s": "Slide Rối loạn tuần hoàn"}, {"q": "pH = 7,25; pCO2 = 40 mmHg; HCO3- = 18 mmol/L. Rối loạn acid–base nào?", "o": ["Toan chuyển hóa", "Toan hô hấp", "Kiềm chuyển hóa", "Kiềm hô hấp"], "a": 0, "e": "pH 7,25 nhỏ hơn 7,35 nên là toan. pCO2 bình thường (40) trong khi HCO3- giảm (18, bình thường 22–26), nghĩa là nguyên nhân do mất hoặc giảm bicarbonat: toan chuyển hóa.", "x": "Toan hô hấp cần pCO2 tăng. Kiềm thì pH phải trên 7,45.", "s": "Không có trong các slide đã gửi, giải thích theo kiến thức chung của môn"}, {"q": "Cấu trúc nào của hệ miễn dịch bẩm sinh nhận diện PAMP và DAMP?", "o": ["PRR", "TCR", "Chemokine", "BCR"], "a": 0, "e": "Miễn dịch bẩm sinh nhận diện PAMP (mẫu phân tử của tác nhân gây bệnh) và DAMP (mẫu phân tử từ tế bào tổn thương) bằng các thụ thể nhận diện mẫu (PRR) như TLR, NLR, RLR.", "x": "TCR và BCR là thụ thể kháng nguyên của lympho T và B, thuộc miễn dịch thích nghi. Chemokine là chất hóa hướng động, không phải thụ thể nhận diện.", "s": "Slide Miễn dịch bẩm sinh"}, {"q": "Cơ chế nào làm hoạt hóa tế bào NK để diệt tế bào nhiễm virus?", "o": ["Tế bào nhiễm giảm biểu lộ phối tử cho thụ thể hoạt hóa", "Tế bào nhiễm giảm biểu lộ MHC lớp I", "Tế bào nhiễm bị hoại tử", "Tế bào nhiễm chết theo chương trình"], "a": 1, "e": "Tế bào bình thường biểu lộ MHC lớp I, gắn vào thụ thể ức chế của NK nên NK không tấn công. Tế bào nhiễm virus giảm biểu lộ MHC lớp I, thụ thể ức chế không được gắn, đồng thời tế bào nhiễm biểu lộ phối tử cho thụ thể hoạt hóa, nên NK được hoạt hóa và diệt tế bào nhiễm.", "x": "Phối tử cho thụ thể hoạt hóa phải tăng chứ không giảm. Hoại tử hay chết theo chương trình là kết quả của quá trình diệt, không phải cơ chế hoạt hóa NK.", "s": "Slide Miễn dịch bẩm sinh"}, {"q": "Trong giai đoạn chọn lọc âm tính ở tuyến ức, lympho T nào bị loại trừ?", "o": ["Nhận tín hiệu từ tế bào trình diện kháng nguyên", "Nhận diện kháng nguyên lạ trình diện trên HLA của bản thân", "Nhận diện kháng nguyên bản thân trình diện trên HLA của bản thân", "Nhận diện HLA của bản thân"], "a": 2, "e": "Chọn lọc âm tính xảy ra ở vùng tủy tuyến ức: tế bào T nào nhận diện kháng nguyên của chính bản thân trình diện trên HLA của bản thân thì bị loại bỏ (chết hoặc bất hoạt). Việc này tạo dung nạp trung ương, nếu lệch lạc sẽ gây bệnh tự miễn.", "x": "Tế bào T nhận diện HLA của bản thân được giữ lại ở bước chọn lọc dương tính (ở vùng vỏ), không bị loại. Nhận diện kháng nguyên lạ trên HLA của bản thân chính là chức năng cần có của tế bào T trưởng thành nên cũng không bị loại.", "s": "Slide Tế bào miễn dịch và cơ quan lympho"}, {"q": "Huyết áp 152/95 mmHg được phân loại là gì?", "o": ["Tăng huyết áp giai đoạn 1", "Tăng huyết áp giai đoạn 2", "Tiền tăng huyết áp", "Bình thường"], "a": 0, "e": "Theo phân loại JNC VII: tăng huyết áp giai đoạn 1 khi tâm thu 140–159 mmHg hoặc tâm trương 90–99 mmHg. Huyết áp 152/95 nằm trong khoảng này.", "x": "Giai đoạn 2 là từ 160/100 trở lên. Tiền tăng huyết áp là 120–139/80–89. Bình thường dưới 120/80.", "s": "Slide Rối loạn tuần hoàn"}, {"q": "Biến chứng của suy giảm chức năng thận là gì?", "o": ["Giảm ure máu", "Thiếu máu", "Tụt huyết áp", "Tăng sản tủy xương"], "a": 1, "e": "Suy thận mạn giảm sản xuất erythropoietin nên gây thiếu máu (thiếu hụt erythropoietin là một nguyên nhân thiếu máu do giảm sản xuất).", "x": "Ure máu tăng chứ không giảm. Suy thận thường kèm tăng huyết áp. Tủy xương giảm sản chứ không tăng sản.", "s": "Slide Hội chứng thiếu máu"}, {"q": "Một người đàn ông sụt cân, có anh trai bị ĐTĐ type 2. Tiêu chuẩn nào xác định người này bị ĐTĐ?", "o": ["Đường huyết ngay sau ăn 140 mg/dL", "HbA1c 4%", "Đường huyết đói 140 mg/dL", "Đường niệu dương tính"], "a": 2, "e": "Tiêu chuẩn chẩn đoán đái tháo đường: đường huyết đói từ 126 mg/dL (7,0 mmol/L) trở lên, hoặc đường huyết bất kỳ từ 200 mg/dL trở lên kèm triệu chứng, hoặc HbA1c từ 6,5% trở lên. Đường huyết đói 140 vượt ngưỡng nên đủ chẩn đoán.", "x": "Đường huyết sau ăn 140 là bình thường. HbA1c 4% thấp, bình thường. Đường niệu dương tính chỉ gợi ý, không dùng làm tiêu chuẩn chẩn đoán.", "s": "Không có trong các slide đã gửi, giải thích theo kiến thức chung của môn"}, {"q": "Bệnh nhân dị ứng mạt bụi nhà, thuốc điều trị nào phù hợp?", "o": ["Kháng thể kháng IgE (Omalizumab)", "Kháng thể kháng TNF-alpha", "Kháng IL-1", "Kháng IL-17"], "a": 0, "e": "Dị ứng mạt bụi nhà là quá mẫn type I qua IgE. Omalizumab là kháng thể đơn dòng kháng IgE, làm giảm IgE tự do và hạn chế hoạt hóa tế bào Mast.", "x": "Kháng TNF-α, kháng IL-1 và kháng IL-17 dùng cho bệnh viêm, tự miễn, không nhắm vào IgE của dị ứng.", "s": "Không có trong các slide đã gửi, giải thích theo kiến thức chung của môn"}, {"q": "Trong xơ vữa động mạch, lipoprotein nào có giá trị tiên lượng giảm nguy cơ?", "o": ["Giảm LDL hơn so với mức bình thường", "Tăng HDL hơn so với mức bình thường", "Giảm HDL", "Tăng chylomicron"], "a": 1, "e": "HDL vận chuyển cholesterol từ mô về gan (vận chuyển ngược), có tác dụng bảo vệ chống xơ vữa. Tăng HDL so với mức bình thường là yếu tố tiên lượng giảm nguy cơ.", "x": "Giảm LDL tốt nhưng \"giảm hơn so với mức bình thường\" không phải yếu tố bảo vệ đặc hiệu như HDL. Giảm HDL và tăng chylomicron làm tăng nguy cơ.", "s": "Không có trong các slide đã gửi, giải thích theo kiến thức chung của môn"}, {"q": "Lý do nào giúp tiêm chủng đậu bò phòng được bệnh đậu mùa?", "o": ["Phản ứng chéo kháng nguyên giữa hai loại virus", "Tình trạng dung nạp miễn dịch", "Kháng nguyên của hai loại hoàn toàn giống nhau", "Tạo miễn dịch không đặc hiệu"], "a": 0, "e": "Virus đậu bò và virus đậu mùa có một số kháng nguyên giống nhau (phản ứng chéo). Miễn dịch tạo ra khi tiêm đậu bò nhận diện được virus đậu mùa nên phòng được bệnh.", "x": "Hai loại không hoàn toàn giống nhau. Đây là miễn dịch đặc hiệu, không phải không đặc hiệu, và không phải dung nạp miễn dịch (dung nạp là không đáp ứng).", "s": "Không có trong các slide đã gửi, giải thích theo kiến thức chung của môn"}, {"q": "Công thức immunoglobulin nào sau đây đúng?", "o": ["IgE – λ2ε2", "IgG – κ2δ2", "IgM – λ2μμ", "IgA – λ2κ2"], "a": 0, "e": "IgE gồm 2 chuỗi nhẹ (κ hoặc λ) và 2 chuỗi nặng ε, viết là λ2ε2. Các lớp khác: IgG chuỗi γ, IgM chuỗi μ, IgA chuỗi α, IgD chuỗi δ.", "x": "Các công thức còn lại gán sai chuỗi nặng cho lớp kháng thể.", "s": "Không có trong các slide đã gửi, giải thích theo kiến thức chung của môn"}, {"q": "Bản chất cơ chế biểu hiện lâm sàng của suy tim trái là gì?", "o": ["Thiếu máu nuôi tim", "Ứ máu ở phổi", "Giảm thông khí phổi", "Ứ máu ngoại vi"], "a": 1, "e": "Suy tim trái làm máu không được bơm đi hết, ứ lại ở tuần hoàn phổi (ứ máu phổi, xung huyết phổi) gây khó thở, ho, ran ẩm.", "x": "Ứ máu ngoại vi là hậu quả của suy tim phải. Thiếu máu nuôi tim là hậu quả của phì đại tim chứ không phải bản chất biểu hiện của suy tim trái.", "s": "Slide Rối loạn tuần hoàn"}, {"q": "Bệnh Thalassemia là bệnh lý do rối loạn gì?", "o": ["Bất thường hemoglobin", "Khiếm khuyết màng hồng cầu", "Thiếu men bẩm sinh", "Bất thường tiểu cầu"], "a": 0, "e": "Thalassemia là bệnh di truyền với khiếm khuyết tổng hợp chuỗi globin (α hoặc β), tức rối loạn tổng hợp hemoglobin. Hậu quả là giảm sản xuất Hb gây thiếu máu nhược sắc, hồng cầu nhỏ.", "x": "Khiếm khuyết màng hồng cầu là bệnh hồng cầu hình cầu di truyền. Thiếu enzyme là bệnh thiếu men G6PD. Đây là các nhóm tán huyết khác.", "s": "Slide Hội chứng thiếu máu"}, {"q": "Trong nhiễm cấp với vi sinh vật gây bệnh, kháng thể loại nào tăng cao trong máu?", "o": ["IgE", "IgM", "IgG", "IgD"], "a": 1, "e": "Trong nhiễm cấp, IgM xuất hiện đầu tiên và tăng cao. IgG tăng muộn hơn, báo hiệu giai đoạn muộn hoặc đáp ứng nhớ.", "x": "IgE liên quan dị ứng và ký sinh trùng, IgD chủ yếu là thụ thể trên lympho B.", "s": "Slide Tế bào miễn dịch và cơ quan lympho"}, {"q": "Tổn thương xảy ra ở màng mao mạch – phế nang ảnh hưởng chủ yếu đến quá trình nào?", "o": ["Thông khí", "Khuếch tán", "Vận chuyển khí trong máu", "Trao đổi khí ở mô"], "a": 1, "e": "Trao đổi O2 và CO2 giữa phế nang và máu mao mạch diễn ra qua màng phế nang – mao mạch bằng khuếch tán. Tổn thương màng này gây rối loạn khuếch tán.", "x": "Thông khí là đưa khí vào ra phổi, vận chuyển khí là việc của máu và hemoglobin, trao đổi ở mô diễn ra ở mô.", "s": "Không có trong các slide đã gửi, giải thích theo kiến thức chung của môn"}], "2": [{"q": "Cấu trúc nào của hệ miễn dịch bẩm sinh nhận diện PAMP và DAMP?", "o": ["TCR", "BCR", "Chemokine", "PRR"], "a": 3, "e": "Miễn dịch bẩm sinh nhận diện PAMP (mẫu phân tử của tác nhân gây bệnh) và DAMP (mẫu phân tử từ tế bào tổn thương) bằng các thụ thể nhận diện mẫu (PRR) như TLR, NLR, RLR.", "x": "TCR và BCR là thụ thể kháng nguyên của lympho T và B, thuộc miễn dịch thích nghi. Chemokine là chất hóa hướng động, không phải thụ thể nhận diện.", "s": "Slide Miễn dịch bẩm sinh"}, {"q": "Thành phần nào của miễn dịch bẩm sinh nhưng liên quan mật thiết với miễn dịch thích nghi?", "o": ["Bạch cầu trung tính", "Tế bào Mast", "Đại thực bào", "Lympho T"], "a": 2, "e": "Đại thực bào thuộc miễn dịch bẩm sinh (thực bào mạnh) nhưng còn xử lý và trình diện kháng nguyên cho lympho T, và tiết cytokine (IL-1, TNF), nên liên quan chặt chẽ với miễn dịch thích nghi.", "x": "Tế bào Mast, bạch cầu trung tính chủ yếu thực hiện chức năng bẩm sinh. Lympho T thuộc miễn dịch thích nghi.", "s": "Slide Miễn dịch bẩm sinh"}, {"q": "Công thức immunoglobulin nào sau đây đúng?", "o": ["IgE – λ2ε2", "IgG – κ2δ2", "IgM – λ2μμ", "IgA – λ2κ2"], "a": 0, "e": "IgE gồm 2 chuỗi nhẹ (κ hoặc λ) và 2 chuỗi nặng ε, viết là λ2ε2. Các lớp khác: IgG chuỗi γ, IgM chuỗi μ, IgA chuỗi α, IgD chuỗi δ.", "x": "Các công thức còn lại gán sai chuỗi nặng cho lớp kháng thể.", "s": "Không có trong các slide đã gửi, giải thích theo kiến thức chung của môn"}, {"q": "Bản chất của kháng thể là gì?", "o": ["Globulin", "Glycoprotein", "Lipoprotein", "Albumin"], "a": 0, "e": "Theo đáp án được đánh dấu trong đề R23, kháng thể thuộc nhóm globulin miễn dịch (immunoglobulin), nằm ở phân đoạn gamma globulin khi điện di huyết thanh.", "x": "Albumin và lipoprotein là các protein huyết tương khác, không phải kháng thể. Glycoprotein đúng về hóa học (immunoglobulin có gắn carbohydrate), nhưng đề đã đánh dấu Globulin là đáp án.", "s": "Không có trong các slide đã gửi, giải thích theo kiến thức chung của môn"}, {"q": "Thuốc ức chế lysosome (ví dụ hydroxychloroquine) ức chế bệnh tự miễn theo cơ chế nào?", "o": ["Ức chế hoạt hóa lympho T", "Ức chế quá trình trình diện kháng nguyên qua MHC II", "Ức chế sản xuất IgE", "Ức chế bổ thể"], "a": 1, "e": "Hydroxychloroquine làm tăng pH trong lysosome, ức chế enzym xử lý kháng nguyên, cản trở việc trình diện kháng nguyên qua MHC lớp II cho lympho T, nhờ đó giảm bệnh tự miễn.", "x": "Ức chế hoạt hóa lympho T là hậu quả gián tiếp chứ không phải cơ chế trực tiếp qua lysosome.", "s": "Không có trong các slide đã gửi, giải thích theo kiến thức chung của môn"}, {"q": "Thành phần nào sau đây thuộc hàng rào cơ học của miễn dịch bẩm sinh?", "o": ["Vi khuẩn cộng sinh", "Lysozyme trong nước mắt", "Nhu động ruột", "pH thấp"], "a": 2, "e": "Hàng rào cơ học gồm lớp biểu mô liên tục, keratin, chất nhầy, lông chuyển, nhu động ruột và dòng nước tiểu: các yếu tố cuốn trôi hoặc cản vi sinh vật về mặt vật lý.", "x": "Acid (như dịch vị), pH thấp (âm đạo), lysozyme và vi khuẩn cộng sinh thuộc hàng rào hóa sinh học.", "s": "Slide Miễn dịch bẩm sinh"}, {"q": "pH = 7,33; HCO3- = 20 mmol/L; pCO2 = 40 mmHg. Rối loạn acid–base nào?", "o": ["Toan chuyển hóa", "Kiềm hô hấp", "Kiềm chuyển hóa", "Toan hô hấp"], "a": 0, "e": "pH 7,33 là toan nhẹ. HCO3- giảm (20, bình thường 22–26), pCO2 bình thường (40): toan chuyển hóa.", "x": "Toan hô hấp cần pCO2 tăng, ở đây pCO2 bình thường. Kiềm thì pH phải trên 7,45.", "s": "Không có trong các slide đã gửi, giải thích theo kiến thức chung của môn"}, {"q": "Thiếu máu nhược sắc hồng cầu nhỏ có thể gặp ở bệnh lý nào?", "o": ["Thiếu máu xuất huyết", "Thiếu máu thiếu vitamin B12", "Thiếu máu thiếu sắt", "Thiếu máu do bất sản tủy"], "a": 2, "e": "Thiếu sắt làm tổng hợp hemoglobin giảm, gây thiếu máu nhược sắc, hồng cầu nhỏ (MCV, MCH, MCHC giảm), kèm sắt huyết thanh và ferritin giảm.", "x": "Thiếu vitamin B12 và folic acid gây hồng cầu to. Mất máu cấp thường đẳng sắc, đẳng bào. Bất sản tủy là giảm sản xuất do tủy tổn thương, không đặc trưng nhược sắc hồng cầu nhỏ.", "s": "Slide Hội chứng thiếu máu"}, {"q": "Thiếu máu tán huyết có đặc điểm nào sau đây?", "o": ["Thể tích máu giảm", "Sắt huyết thanh giảm", "Hồng cầu lưới giảm", "Bilirubin tự do tăng"], "a": 3, "e": "Tán huyết làm hồng cầu vỡ nhiều, giải phóng hemoglobin chuyển thành bilirubin tự do nên bilirubin tự do tăng. Ngoài ra Hb tự do và Fe huyết thanh tăng, hồng cầu lưới tăng.", "x": "Hồng cầu lưới tăng (tủy bù trừ) chứ không giảm. Sắt huyết thanh tăng chứ không giảm. Thể tích máu thường bình thường, giảm là đặc điểm của mất máu.", "s": "Slide Hội chứng thiếu máu"}, {"q": "Cái nào KHÔNG phải là nguyên nhân của cao huyết áp do rối loạn nội tiết?", "o": ["Hội chứng Crohn", "U tuyến thượng thận", "Hội chứng Cushing", "U tuyến giáp lành tính"], "a": 3, "e": "Theo slide, tăng huyết áp do rối loạn nội tiết gồm: u tủy thượng thận (tăng epinephrine, norepinephrine), u vỏ thượng thận (hội chứng Conn, tăng aldosterone) và hội chứng Cushing. U tuyến giáp lành tính không thuộc danh sách này, và đề R24 đánh dấu đây là đáp án.", "x": "Ba phương án còn lại là nguyên nhân nội tiết đã nêu trong slide. Lưu ý Crohn là bệnh tiêu hóa nên cũng không phải nguyên nhân nội tiết, câu này đề ra chưa chặt.", "s": "Slide Rối loạn tuần hoàn"}, {"q": "Khát nước do cơ chế nào gây ra?", "o": ["Tăng thể tích huyết tương", "Giảm áp suất thẩm thấu huyết tương", "Tăng áp suất thẩm thấu huyết tương", "Tăng nhạy cảm ADH"], "a": 2, "e": "Tăng áp suất thẩm thấu huyết tương (hoặc giảm thể tích) kích thích trung tâm khát ở vùng dưới đồi, gây cảm giác khát (yếu tố quyết định lượng nước uống vào).", "x": "Giảm áp suất thẩm thấu huyết tương hay tăng thể tích huyết tương làm giảm khát.", "s": "Slide Mất cân bằng muối – nước"}, {"q": "Tế bào T độc (CTL) nhận diện và tiêu diệt tế bào nhiễm vi sinh vật nội bào thông qua phân tử nào?", "o": ["MHC I", "Thụ thể Fc", "Thụ thể bổ thể", "MHC II"], "a": 0, "e": "Tế bào T độc (CD8+) nhận diện kháng nguyên trình diện trên MHC lớp I, đặc biệt kháng nguyên của vi sinh vật nội bào, rồi tiêu diệt tế bào nhiễm.", "x": "MHC lớp II trình diện kháng nguyên cho T hỗ trợ CD4. Thụ thể Fc là của các tế bào gắn kháng thể (như NK, đại thực bào).", "s": "Slide Tế bào miễn dịch và cơ quan lympho"}, {"q": "Bệnh nhân nghiện rượu bị loét dạ dày, đau vùng thượng vị. Cơ chế?", "o": ["Tăng tưới máu dưới niêm", "Mất cân bằng giữa yếu tố tấn công và bảo vệ", "Tăng tái tạo tế bào do prostaglandin và TGF", "Tăng hệ đệm bicarbonat và tiết nhầy bảo vệ niêm mạc"], "a": 1, "e": "Loét dạ dày là hậu quả mất cân bằng giữa yếu tố tấn công (rượu, NSAID, H. pylori, HCl, pepsin) và yếu tố bảo vệ (chất nhầy, bicarbonate, prostaglandin, tưới máu niêm mạc), trong đó yếu tố tấn công ưu thế.", "x": "Các phương án còn lại đều mô tả yếu tố bảo vệ tăng, trái với cơ chế gây loét.", "s": "Slide Sinh lý bệnh tiêu hóa – gan mật"}, {"q": "pH = 7,25; pCO2 = 52 mmHg; HCO3- = 24 mmol/L. Rối loạn acid–base nào?", "o": ["Toan chuyển hóa", "Kiềm hô hấp", "Kiềm chuyển hóa", "Toan hô hấp"], "a": 3, "e": "pH 7,25 là toan. pCO2 tăng (52) còn HCO3- bình thường (24): toan hô hấp.", "x": "Toan chuyển hóa cần HCO3- giảm, ở đây HCO3- bình thường. Kiềm thì pH phải trên 7,45.", "s": "Không có trong các slide đã gửi, giải thích theo kiến thức chung của môn"}, {"q": "Yếu tố nào sau đây ảnh hưởng chính đến huyết áp?", "o": ["Thể tích máu và độ bão hòa oxy máu", "Sức co cơ tim và thể tích thông khí phổi", "Lưu lượng tim và sức cản ngoại vi", "Sức đàn hồi và tính thấm thành mạch"], "a": 2, "e": "Huyết áp = lưu lượng tim × sức cản ngoại vi. Lưu lượng tim phụ thuộc thể tích máu về và sức co cơ tim, sức cản ngoại vi phụ thuộc độ nhớt máu và sức đàn hồi (co, giãn) thành mạch.", "x": "Các phương án khác chỉ nêu những yếu tố gián tiếp hoặc không liên quan trực tiếp (độ bão hòa oxy máu, thể tích thông khí phổi, tính thấm thành mạch).", "s": "Slide Rối loạn tuần hoàn"}, {"q": "Trong nhiễm cấp với vi sinh vật gây bệnh, kháng thể loại nào tăng cao trong máu?", "o": ["IgD", "IgG", "IgE", "IgM"], "a": 3, "e": "Trong nhiễm cấp, IgM xuất hiện đầu tiên và tăng cao. IgG tăng muộn hơn, báo hiệu giai đoạn muộn hoặc đáp ứng nhớ.", "x": "IgE liên quan dị ứng và ký sinh trùng, IgD chủ yếu là thụ thể trên lympho B.", "s": "Slide Tế bào miễn dịch và cơ quan lympho"}, {"q": "Cơ chế ổn định huyết áp lâu dài là gì?", "o": ["Dịch ngoại bào và hệ RAA", "Tăng sức bóp cơ tim tức thời", "Co mạch ngoại vi", "Thay đổi sức cản ngoại biên cấp do thụ thể áp lực"], "a": 0, "e": "Ổn định huyết áp lâu dài nhờ điều hòa thể tích dịch ngoại bào và hệ renin – angiotensin – aldosterone (qua thận), điều chỉnh lượng muối và nước.", "x": "Thụ thể áp lực, co mạch ngoại vi và tăng sức bóp cơ tim chỉ điều chỉnh nhanh, ngắn hạn.", "s": "Slide Rối loạn tuần hoàn"}, {"q": "Bệnh nhân 17 tuổi, đường huyết 20 mmol/L, ceton tăng, ăn nhiều, uống nhiều, tiểu nhiều, sụt cân nhiều. Cơ chế sụt cân là gì?", "o": ["Mất nước đơn thuần do tiểu nhiều", "Giảm hấp thu glucose ở ruột", "Tăng phân giải glycogen, protein, lipid khi tế bào thiếu năng lượng do không sử dụng được glucose", "Tăng tổng hợp lipid và protein"], "a": 2, "e": "Thiếu insulin: tế bào không dùng được glucose nên cơ thể tăng phân giải glycogen, protein, lipid để lấy năng lượng, sinh ceton và gây sụt cân nhiều.", "x": "Tăng tổng hợp lipid, protein hay giảm hấp thu glucose ở ruột đều không giải thích sụt cân trong thiếu insulin.", "s": "Không có trong các slide đã gửi, giải thích theo kiến thức chung của môn"}, {"q": "Yếu tố nào KHÔNG thuộc nhóm bảo vệ niêm mạc dạ dày?", "o": ["Mạch máu, oxy dưới niêm mạc", "Prostaglandin giúp tái tạo mô", "Chất nhầy, bicarbonate bảo vệ niêm mạc", "Pepsin, HCl do tế bào chính và tế bào thành tiết ra"], "a": 3, "e": "Pepsin và HCl (do tế bào chính và tế bào thành tiết ra) là yếu tố tấn công, không phải yếu tố bảo vệ.", "x": "Chất nhầy, bicarbonate, prostaglandin, mạch máu và oxy dưới niêm mạc đều là yếu tố bảo vệ.", "s": "Slide Sinh lý bệnh tiêu hóa – gan mật"}, {"q": "Tỷ lệ % lipid trong chylomicron (theo thứ tự triglyceride : cholesterol : phospholipid)?", "o": ["95 : 2 : 3", "10 : 45 : 45", "50 : 25 : 25", "25 : 25 : 50"], "a": 0, "e": "Chylomicron vận chuyển lipid từ thức ăn nên chủ yếu là triglyceride (khoảng 90–95%), cholesterol và phospholipid chỉ chiếm vài phần trăm. Vì vậy tỷ lệ 95 : 2 : 3 là đúng.", "x": "Các tỷ lệ 50 : 25 : 25 hoặc 25 : 25 : 50 là thành phần của lipoprotein khác (như LDL, HDL), không phải chylomicron.", "s": "Không có trong các slide đã gửi, giải thích theo kiến thức chung của môn"}, {"q": "Trong giai đoạn chọn lọc âm tính ở tuyến ức, lympho T nào bị loại trừ?", "o": ["Nhận diện kháng nguyên bản thân trình diện trên HLA của bản thân", "Nhận tín hiệu từ tế bào trình diện kháng nguyên", "Nhận diện kháng nguyên lạ trình diện trên HLA của bản thân", "Nhận diện HLA của bản thân"], "a": 0, "e": "Chọn lọc âm tính xảy ra ở vùng tủy tuyến ức: tế bào T nào nhận diện kháng nguyên của chính bản thân trình diện trên HLA của bản thân thì bị loại bỏ (chết hoặc bất hoạt). Việc này tạo dung nạp trung ương, nếu lệch lạc sẽ gây bệnh tự miễn.", "x": "Tế bào T nhận diện HLA của bản thân được giữ lại ở bước chọn lọc dương tính (ở vùng vỏ), không bị loại. Nhận diện kháng nguyên lạ trên HLA của bản thân chính là chức năng cần có của tế bào T trưởng thành nên cũng không bị loại.", "s": "Slide Tế bào miễn dịch và cơ quan lympho"}, {"q": "Quá trình chọn lọc clone diễn ra khi lympho trưởng thành tương tác với yếu tố nào?", "o": ["Tế bào trình diện kháng nguyên", "Kháng nguyên đặc hiệu", "Cytokine", "Yếu tố hóa hướng động"], "a": 1, "e": "Chọn lọc clone: kháng nguyên đặc hiệu chọn đúng clone lympho có thụ thể phù hợp để tăng sinh và biệt hóa thành tế bào hiệu quả và tế bào nhớ.", "x": "Cytokine, tế bào trình diện kháng nguyên và chất hóa hướng động hỗ trợ đáp ứng nhưng không phải yếu tố chọn clone.", "s": "Slide Tế bào miễn dịch và cơ quan lympho"}, {"q": "Cấu trúc của insulin?", "o": ["1 chuỗi polypeptide nội bào", "3 chuỗi polypeptide liên kết ion", "2 chuỗi polypeptide liên kết disulfua", "2 chuỗi polypeptide liên kết hydro"], "a": 2, "e": "Insulin gồm 2 chuỗi polypeptide A và B nối nhau bằng cầu nối disulfua.", "x": "Insulin không phải 1 hay 3 chuỗi, và liên kết giữa hai chuỗi là cầu disulfua chứ không phải hydro hay ion.", "s": "Không có trong các slide đã gửi, giải thích theo kiến thức chung của môn"}, {"q": "Cơ quan lympho trung ương là?", "o": ["Lách", "Tủy xương", "Mảng Peyer", "Hạch"], "a": 1, "e": "Cơ quan lympho trung ương là nơi lympho bào biệt hóa và trưởng thành khi chưa tiếp xúc kháng nguyên lạ: tủy xương và tuyến ức (thymus).", "x": "Hạch, lách và mô lympho dưới niêm mạc (mảng Peyer) là cơ quan lympho ngoại vi, nơi lympho tiếp xúc kháng nguyên lạ.", "s": "Slide Tế bào miễn dịch và cơ quan lympho"}, {"q": "Sản phẩm của đáp ứng miễn dịch không phụ thuộc tuyến ức (kháng nguyên T-độc lập) là?", "o": ["IgA", "IgM", "IgD", "IgG"], "a": 1, "e": "Kháng nguyên không phụ thuộc tuyến ức (như polysaccharide) kích thích trực tiếp lympho B mà không cần Th, chủ yếu tạo IgM, không chuyển lớp và không có tế bào nhớ.", "x": "IgG, IgA và IgE là kết quả của chuyển lớp kháng thể, cần sự giúp đỡ của Th (phụ thuộc tuyến ức).", "s": "Slide Tế bào miễn dịch và cơ quan lympho"}, {"q": "Nhiễm ký sinh trùng đặc trưng bởi tăng loại bạch cầu nào?", "o": ["Bạch cầu trung tính", "Bạch cầu đơn nhân", "Bạch cầu ái kiềm", "Bạch cầu ái toan"], "a": 3, "e": "Nhiễm ký sinh trùng (nhất là giun sán) làm tăng bạch cầu ái toan. Bạch cầu ái toan đề kháng chống ký sinh trùng, diệt ký sinh trùng được bao bởi kháng thể.", "x": "Bạch cầu trung tính tăng trong nhiễm khuẩn. Bạch cầu ái kiềm liên quan phản ứng dị ứng. Bạch cầu đơn nhân là tế bào thực bào và trình diện kháng nguyên.", "s": "Slide Miễn dịch bẩm sinh"}, {"q": "Vì sao phải tiêm vaccine COVID-19 nhiều lần?", "o": ["Do kháng thể IgG tồn tại vĩnh viễn", "Do vaccine gây dung nạp miễn dịch", "Do virus biến đổi nên hiệu lực vaccine giảm", "Do vaccine chỉ kích thích miễn dịch bẩm sinh"], "a": 2, "e": "Virus SARS-CoV-2 liên tục đột biến, kháng nguyên thay đổi nên hiệu lực của vaccine giảm dần. Vì vậy phải tiêm nhắc lại, thường bằng vaccine cập nhật.", "x": "Các lý do còn lại không đúng với thực tế miễn dịch học (vaccine không gây dung nạp miễn dịch hay chỉ kích thích miễn dịch bẩm sinh).", "s": "Không có trong các slide đã gửi, giải thích theo kiến thức chung của môn"}, {"q": "Tác dụng chính của Th17?", "o": ["Hoạt hóa đại thực bào viêm", "Kích thích lympho", "Hoạt hóa neutrophil", "Kích thích tế bào Mast"], "a": 2, "e": "Th17 tiết IL-17, thu hút và hoạt hóa neutrophil, bảo vệ chống vi khuẩn và nấm ngoại bào.", "x": "Hoạt hóa đại thực bào là chức năng của Th1, kích thích tế bào Mast không phải chức năng chính, kích thích lympho là chức năng chung của nhiều tế bào T.", "s": "Không có trong các slide đã gửi, giải thích theo kiến thức chung của môn"}, {"q": "Lý do nào giúp tiêm chủng đậu bò phòng được bệnh đậu mùa?", "o": ["Kháng nguyên của hai loại hoàn toàn giống nhau", "Tạo miễn dịch không đặc hiệu", "Phản ứng chéo kháng nguyên giữa hai loại virus", "Tình trạng dung nạp miễn dịch"], "a": 2, "e": "Virus đậu bò và virus đậu mùa có một số kháng nguyên giống nhau (phản ứng chéo). Miễn dịch tạo ra khi tiêm đậu bò nhận diện được virus đậu mùa nên phòng được bệnh.", "x": "Hai loại không hoàn toàn giống nhau. Đây là miễn dịch đặc hiệu, không phải không đặc hiệu, và không phải dung nạp miễn dịch (dung nạp là không đáp ứng).", "s": "Không có trong các slide đã gửi, giải thích theo kiến thức chung của môn"}, {"q": "Bệnh nhân xơ gan, yếu tố nào gây hạ đường huyết đột ngột?", "o": ["Tăng hoạt hóa phó giao cảm", "Giảm đáp ứng tế bào gan với insulin", "Tăng tổng hợp lipid", "Giảm dự trữ glycogen"], "a": 3, "e": "Xơ gan nặng làm giảm dự trữ glycogen và giảm tân tạo glucose, nên dễ hạ đường huyết đột ngột, làm nặng thêm bệnh não gan.", "x": "Giảm đáp ứng của tế bào gan với insulin xảy ra ở giai đoạn đầu và gây tăng đường huyết, không phải hạ đường huyết. Tăng tổng hợp lipid dẫn đến gan nhiễm mỡ.", "s": "Slide Sinh lý bệnh tiêu hóa – gan mật"}, {"q": "Viêm phổi gây ứ dịch ở phế nang. Rối loạn ở giai đoạn nào gây suy hô hấp?", "o": ["Thông khí", "Trao đổi khí tại mô", "Vận chuyển khí trong máu", "Khuếch tán tại phổi"], "a": 3, "e": "Dịch ứ ở phế nang làm dày và cản trở màng trao đổi khí, gây rối loạn khuếch tán tại phổi.", "x": "Thông khí là đưa khí vào ra phổi, vận chuyển và trao đổi ở mô diễn ra ngoài phổi.", "s": "Không có trong các slide đã gửi, giải thích theo kiến thức chung của môn"}, {"q": "Biến chứng của suy giảm chức năng thận là gì?", "o": ["Thiếu máu", "Tụt huyết áp", "Giảm ure máu", "Tăng sản tủy xương"], "a": 0, "e": "Suy thận mạn giảm sản xuất erythropoietin nên gây thiếu máu (thiếu hụt erythropoietin là một nguyên nhân thiếu máu do giảm sản xuất).", "x": "Ure máu tăng chứ không giảm. Suy thận thường kèm tăng huyết áp. Tủy xương giảm sản chứ không tăng sản.", "s": "Slide Hội chứng thiếu máu"}, {"q": "Triệu chứng thần kinh do hạ natri máu là gì?", "o": ["Phù do dịch vào tế bào não", "Thiếu máu não thoáng qua", "Tăng áp suất nội sọ do máu tụ", "Tăng áp suất thẩm thấu"], "a": 0, "e": "Hạ natri máu làm giảm áp suất thẩm thấu ngoại bào, nước đi vào tế bào, gây phù tế bào não, từ đó có triệu chứng thần kinh (đau đầu, lú lẫn, co giật).", "x": "Hạ natri máu làm giảm chứ không tăng áp suất thẩm thấu. Thiếu máu não thoáng qua không phải cơ chế.", "s": "Slide Mất cân bằng muối – nước"}, {"q": "Cơ chế nào làm hoạt hóa tế bào NK để diệt tế bào nhiễm virus?", "o": ["Tế bào nhiễm chết theo chương trình", "Tế bào nhiễm bị hoại tử", "Tế bào nhiễm giảm biểu lộ phối tử cho thụ thể hoạt hóa", "Tế bào nhiễm giảm biểu lộ MHC lớp I"], "a": 3, "e": "Tế bào bình thường biểu lộ MHC lớp I, gắn vào thụ thể ức chế của NK nên NK không tấn công. Tế bào nhiễm virus giảm biểu lộ MHC lớp I, thụ thể ức chế không được gắn, đồng thời tế bào nhiễm biểu lộ phối tử cho thụ thể hoạt hóa, nên NK được hoạt hóa và diệt tế bào nhiễm.", "x": "Phối tử cho thụ thể hoạt hóa phải tăng chứ không giảm. Hoại tử hay chết theo chương trình là kết quả của quá trình diệt, không phải cơ chế hoạt hóa NK.", "s": "Slide Miễn dịch bẩm sinh"}, {"q": "Bệnh nhân dị ứng mạt bụi nhà, thuốc điều trị nào phù hợp?", "o": ["Kháng IL-1", "Kháng IL-17", "Kháng thể kháng IgE (Omalizumab)", "Kháng thể kháng TNF-alpha"], "a": 2, "e": "Dị ứng mạt bụi nhà là quá mẫn type I qua IgE. Omalizumab là kháng thể đơn dòng kháng IgE, làm giảm IgE tự do và hạn chế hoạt hóa tế bào Mast.", "x": "Kháng TNF-α, kháng IL-1 và kháng IL-17 dùng cho bệnh viêm, tự miễn, không nhắm vào IgE của dị ứng.", "s": "Không có trong các slide đã gửi, giải thích theo kiến thức chung của môn"}, {"q": "Phát biểu nào sau đây SAI về bệnh?", "o": ["Bệnh có nguyên nhân và điều kiện gây bệnh", "Bệnh do thế lực siêu hình gây ra", "Bệnh là một trạng thái cân bằng mới kém ổn định", "Bệnh là sự thay đổi cấu trúc và chức năng của cơ thể"], "a": 1, "e": "Bệnh là một quá trình có nguyên nhân cụ thể và giải thích được bằng khoa học. Quan niệm bệnh do thế lực siêu hình gây ra là duy tâm, nên phát biểu này sai.", "x": "Bệnh là trạng thái cân bằng mới kém ổn định so với trạng thái bình thường, đây là phát biểu đúng.", "s": "Không có trong các slide đã gửi, giải thích theo kiến thức chung của môn"}, {"q": "Huyết áp 152/95 mmHg được phân loại là gì?", "o": ["Tăng huyết áp giai đoạn 2", "Tăng huyết áp giai đoạn 1", "Bình thường", "Tiền tăng huyết áp"], "a": 1, "e": "Theo phân loại JNC VII: tăng huyết áp giai đoạn 1 khi tâm thu 140–159 mmHg hoặc tâm trương 90–99 mmHg. Huyết áp 152/95 nằm trong khoảng này.", "x": "Giai đoạn 2 là từ 160/100 trở lên. Tiền tăng huyết áp là 120–139/80–89. Bình thường dưới 120/80.", "s": "Slide Rối loạn tuần hoàn"}, {"q": "Bệnh nhân xơ gan, nội soi thấy giãn tĩnh mạch thực quản. Cơ chế liên quan tăng áp lực tĩnh mạch cửa là gì?", "o": ["Tăng tổng hợp albumin", "Ứ máu tĩnh mạch cửa, hình thành tuần hoàn bàng hệ cửa – chủ ở thực quản", "Giảm áp lực tĩnh mạch cửa", "Co mạch tạng"], "a": 1, "e": "Xơ gan làm tăng áp lực tĩnh mạch cửa, máu ứ lại và tìm đường về tim qua tuần hoàn bàng hệ ngoài gan (tĩnh mạch thực quản, trĩ, tĩnh mạch dưới da bụng). Tĩnh mạch thực quản giãn nên dễ vỡ gây nôn ra máu.", "x": "Các phương án khác không mô tả đúng cơ chế tuần hoàn bàng hệ của tăng áp lực tĩnh mạch cửa.", "s": "Slide Sinh lý bệnh tiêu hóa – gan mật"}, {"q": "Tác nhân gây tiêu chảy thẩm thấu là?", "o": ["Salmonella", "Độc tố tả", "Thiếu men lactase", "Hội chứng ruột kích thích"], "a": 2, "e": "Tiêu chảy thẩm thấu xảy ra khi trong lòng ruột có chất tan thẩm thấu cao không hấp thu được, giữ nước lại. Thiếu men lactase làm lactose không tiêu hóa, thu hút nước vào ruột nên gây tiêu chảy thẩm thấu (như thuốc tẩy muối magie).", "x": "Độc tố tả gây tiêu chảy tiết dịch. Salmonella gây tiêu chảy do viêm. Hội chứng ruột kích thích gây tiêu chảy do rối loạn nhu động.", "s": "Slide Sinh lý bệnh tiêu hóa – gan mật"}, {"q": "Em học sinh N bị tiểu đường type 2 một năm, ăn nhiều nhưng vẫn sụt cân. Lý do?", "o": ["Tăng chuyển hóa do kháng insulin lâu dài", "Thoái giáng protid và lipid để tạo năng lượng", "Tăng tổng hợp glycogen ở gan", "Giảm hấp thu thức ăn ở ruột"], "a": 1, "e": "Đái tháo đường type 2 kháng insulin lâu dài: tế bào không dùng được glucose, cơ thể phải thoái giáng protid và lipid để lấy năng lượng nên sụt cân dù ăn nhiều.", "x": "Tăng chuyển hóa do kháng insulin không phải cơ chế đã được đánh dấu cho câu này.", "s": "Không có trong các slide đã gửi, giải thích theo kiến thức chung của môn"}, {"q": "Tình trạng nào sau đây làm tăng thông khí?", "o": ["Tăng pH máu", "Giảm PaCO2", "Tăng PaO2", "Giảm PaO2"], "a": 3, "e": "Giảm PaO2 kích thích thụ thể hóa học ngoại vi làm tăng thông khí (tăng nhịp và biên độ thở).", "x": "Tăng PaO2 và tăng pH máu làm giảm thông khí. Giảm PaCO2 cũng làm giảm kích thích hô hấp.", "s": "Không có trong các slide đã gửi, giải thích theo kiến thức chung của môn"}, {"q": "pH = 7,25; pCO2 = 40 mmHg; HCO3- = 18 mmol/L. Rối loạn acid–base nào?", "o": ["Toan hô hấp", "Kiềm chuyển hóa", "Kiềm hô hấp", "Toan chuyển hóa"], "a": 3, "e": "pH 7,25 nhỏ hơn 7,35 nên là toan. pCO2 bình thường (40) trong khi HCO3- giảm (18, bình thường 22–26), nghĩa là nguyên nhân do mất hoặc giảm bicarbonat: toan chuyển hóa.", "x": "Toan hô hấp cần pCO2 tăng. Kiềm thì pH phải trên 7,45.", "s": "Không có trong các slide đã gửi, giải thích theo kiến thức chung của môn"}, {"q": "Nồng độ natri máu bình thường?", "o": ["3 – 6 mmol/L", "135 – 145 mmol/L", "120 – 130 mmol/L", "3,5 – 5 mmol/L"], "a": 1, "e": "Natri máu bình thường là 135–145 mmol/L. Dưới 135 là hạ natri máu, trên 145 là tăng natri máu.", "x": "3,5–5 mmol/L là giá trị bình thường của kali máu.", "s": "Slide Mất cân bằng muối – nước"}, {"q": "Bệnh Thalassemia là bệnh lý do rối loạn gì?", "o": ["Khiếm khuyết màng hồng cầu", "Bất thường hemoglobin", "Thiếu men bẩm sinh", "Bất thường tiểu cầu"], "a": 1, "e": "Thalassemia là bệnh di truyền với khiếm khuyết tổng hợp chuỗi globin (α hoặc β), tức rối loạn tổng hợp hemoglobin. Hậu quả là giảm sản xuất Hb gây thiếu máu nhược sắc, hồng cầu nhỏ.", "x": "Khiếm khuyết màng hồng cầu là bệnh hồng cầu hình cầu di truyền. Thiếu enzyme là bệnh thiếu men G6PD. Đây là các nhóm tán huyết khác.", "s": "Slide Hội chứng thiếu máu"}, {"q": "Nồng độ hemoglobin thấp gây ảnh hưởng tới quá trình hô hấp nào?", "o": ["Vận chuyển khí, trao đổi O2 trong mô", "Thông khí, khuếch tán", "Vận chuyển khí, khuếch tán", "Khuếch tán, trao đổi O2 trong mô"], "a": 2, "e": "Theo đáp án được đánh dấu trong đề R23: hemoglobin chở O2 trong máu nên Hb thấp làm giảm vận chuyển khí, và ảnh hưởng đến quá trình khuếch tán O2 từ phế nang vào máu.", "x": "Thông khí là quá trình đưa không khí ra vào phổi, không phụ thuộc nồng độ Hb. Các phương án có \"thông khí\" nên bị loại. Phương án \"vận chuyển khí, trao đổi O2 trong mô\" không phải đáp án mà đề đánh dấu.", "s": "Không có trong các slide đã gửi, giải thích theo kiến thức chung của môn"}, {"q": "pH = 7,30; pCO2 = 50 mmHg; HCO3- = 24 mmol/L. Rối loạn acid–base nào?", "o": ["Toan hô hấp", "Kiềm hô hấp", "Kiềm chuyển hóa", "Toan chuyển hóa"], "a": 0, "e": "pH 7,30 là toan. pCO2 tăng (50, bình thường 35–45), HCO3- bình thường (24), nguyên nhân là ứ CO2: toan hô hấp.", "x": "Toan chuyển hóa cần HCO3- giảm. Kiềm thì pH phải trên 7,45.", "s": "Không có trong các slide đã gửi, giải thích theo kiến thức chung của môn"}, {"q": "Tổn thương xảy ra ở màng mao mạch – phế nang ảnh hưởng chủ yếu đến quá trình nào?", "o": ["Khuếch tán", "Thông khí", "Trao đổi khí ở mô", "Vận chuyển khí trong máu"], "a": 0, "e": "Trao đổi O2 và CO2 giữa phế nang và máu mao mạch diễn ra qua màng phế nang – mao mạch bằng khuếch tán. Tổn thương màng này gây rối loạn khuếch tán.", "x": "Thông khí là đưa khí vào ra phổi, vận chuyển khí là việc của máu và hemoglobin, trao đổi ở mô diễn ra ở mô.", "s": "Không có trong các slide đã gửi, giải thích theo kiến thức chung của môn"}, {"q": "Bệnh nhân khó thở, tiền sử tăng huyết áp lâu năm, ho khan về đêm, nghe ran ở hai đáy phổi. Nguyên nhân?", "o": ["Ứ máu ngoại vi do suy tim phải", "Giãn mạch ngoại vi", "Tràn dịch màng phổi do ung thư", "Ứ máu ở phổi do suy tim trái"], "a": 3, "e": "Tăng huyết áp lâu năm làm thất trái phải làm việc nhiều, dần dần suy tim trái. Máu ứ ở phổi gây khó thở, ho khan về đêm và ran ở hai đáy phổi.", "x": "Ứ máu ngoại vi (phù chân, gan to, tĩnh mạch cổ nổi) là biểu hiện của suy tim phải.", "s": "Slide Rối loạn tuần hoàn"}, {"q": "Lưu bệnh nhân sốc phản vệ thêm 24 giờ tại bệnh viện để làm gì?", "o": ["Chờ kết quả test lẩy da", "Chữa trị suy hô hấp", "Kiểm tra và điều trị nếu xảy ra sốc phản vệ lần 2", "Điều tra nguyên nhân gây phản vệ"], "a": 2, "e": "Sốc phản vệ có thể tái phát dạng hai pha: triệu chứng quay lại sau vài giờ, thường trong 24 giờ, dù đã hết. Vì vậy phải theo dõi để phát hiện và xử trí kịp thời sốc phản vệ lần 2.", "x": "Điều tra nguyên nhân và điều trị suy hô hấp có thể làm nhưng không phải lý do chính của việc giữ lại 24 giờ.", "s": "Không có trong các slide đã gửi, giải thích theo kiến thức chung của môn"}, {"q": "Bản chất cơ chế biểu hiện lâm sàng của suy tim trái là gì?", "o": ["Giảm thông khí phổi", "Ứ máu ở phổi", "Thiếu máu nuôi tim", "Ứ máu ngoại vi"], "a": 1, "e": "Suy tim trái làm máu không được bơm đi hết, ứ lại ở tuần hoàn phổi (ứ máu phổi, xung huyết phổi) gây khó thở, ho, ran ẩm.", "x": "Ứ máu ngoại vi là hậu quả của suy tim phải. Thiếu máu nuôi tim là hậu quả của phì đại tim chứ không phải bản chất biểu hiện của suy tim trái.", "s": "Slide Rối loạn tuần hoàn"}, {"q": "Triệu chứng lâm sàng thường gặp nhất của hội chứng thận hư?", "o": ["Tăng huyết áp và giảm albumin máu", "Phù và đạm niệu > 3 g/24h", "Toan chuyển hóa", "Phù và tiểu máu đại thể"], "a": 1, "e": "Hội chứng thận hư đặc trưng bởi phù, đạm niệu nhiều (trên ngưỡng 3–3,5 g/24h), giảm albumin máu và tăng lipid máu.", "x": "Tăng huyết áp không bắt buộc. Tiểu máu đại thể không phải đặc trưng. Toan chuyển hóa không phải triệu chứng thường gặp nhất.", "s": "Không có trong các slide đã gửi, giải thích theo kiến thức chung của môn"}, {"q": "Sinh lý bệnh KHÔNG có tính chất nào sau đây?", "o": ["Tính tổng hợp", "Tính duy tâm", "Tính tích hợp", "Tính thực nghiệm"], "a": 1, "e": "Sinh lý bệnh có tính tổng hợp, tích hợp và thực nghiệm. Tính duy tâm không phải tính chất của môn khoa học này.", "x": "Ba tính chất còn lại là đúng.", "s": "Không có trong các slide đã gửi, giải thích theo kiến thức chung của môn"}, {"q": "Nạn nhân tai nạn chảy máu nhiều; việc truyền máu nhanh chóng giúp phòng ngừa loại suy thận cấp nào?", "o": ["Suy thận cấp sau thận", "Suy thận cấp trước thận", "Suy thận cấp tại thận", "Suy thận mạn"], "a": 1, "e": "Mất máu nhiều làm giảm thể tích tuần hoàn và giảm tưới máu thận. Truyền máu nhanh giúp phục hồi tưới máu, phòng suy thận cấp trước thận (suy thận cấp chức năng do giảm tưới máu).", "x": "Suy thận cấp tại thận là tổn thương nhu mô thận. Suy thận cấp sau thận là do tắc nghẽn đường tiểu.", "s": "Không có trong các slide đã gửi, giải thích theo kiến thức chung của môn"}, {"q": "Tán huyết do tai biến truyền máu sai nhóm là quá mẫn loại mấy?", "o": ["Type II", "Type I", "Type III", "Type IV"], "a": 0, "e": "Truyền nhầm nhóm máu: kháng thể có sẵn (như kháng A, kháng B) gắn lên hồng cầu của người cho, hoạt hóa bổ thể gây tán huyết. Đây là quá mẫn type II (kháng thể độc tế bào).", "x": "Type I qua IgE (dị ứng), type III do phức hợp miễn dịch, type IV qua tế bào T.", "s": "Không có trong các slide đã gửi, giải thích theo kiến thức chung của môn"}, {"q": "Vì sao bệnh nhân tiểu đường chậm lành vết thương? (ngoại trừ)", "o": ["Môi trường đường huyết cao thuận lợi cho vi khuẩn phát triển", "Giảm khả năng thực bào của bạch cầu đa nhân", "Tự miễn", "Cơ địa dễ nhiễm khuẩn"], "a": 2, "e": "Tự miễn không phải cơ chế chủ yếu làm vết thương ở bệnh nhân tiểu đường chậm lành, nên đây là đáp án cần chọn trong câu hỏi \"ngoại trừ\".", "x": "Ba cơ chế còn lại đều đúng: đường huyết cao thuận lợi cho vi khuẩn phát triển, giảm khả năng thực bào của bạch cầu đa nhân, cơ địa dễ nhiễm khuẩn.", "s": "Không có trong các slide đã gửi, giải thích theo kiến thức chung của môn"}, {"q": "Huyết áp 150/80 mmHg được phân loại là gì?", "o": ["Tăng huyết áp giai đoạn 1", "Bình thường", "Tăng huyết áp giai đoạn 2", "Tiền tăng huyết áp"], "a": 0, "e": "Theo phân loại JNC VII: tâm thu 150 nằm trong khoảng 140–159, nên thuộc giai đoạn 1. Khi tâm thu và tâm trương thuộc hai mức khác nhau, lấy mức cao hơn.", "x": "Giai đoạn 2 cần tâm thu từ 160 hoặc tâm trương từ 100 trở lên.", "s": "Slide Rối loạn tuần hoàn"}, {"q": "Một người đàn ông sụt cân, có anh trai bị ĐTĐ type 2. Tiêu chuẩn nào xác định người này bị ĐTĐ?", "o": ["HbA1c 4%", "Đường niệu dương tính", "Đường huyết đói 140 mg/dL", "Đường huyết ngay sau ăn 140 mg/dL"], "a": 2, "e": "Tiêu chuẩn chẩn đoán đái tháo đường: đường huyết đói từ 126 mg/dL (7,0 mmol/L) trở lên, hoặc đường huyết bất kỳ từ 200 mg/dL trở lên kèm triệu chứng, hoặc HbA1c từ 6,5% trở lên. Đường huyết đói 140 vượt ngưỡng nên đủ chẩn đoán.", "x": "Đường huyết sau ăn 140 là bình thường. HbA1c 4% thấp, bình thường. Đường niệu dương tính chỉ gợi ý, không dùng làm tiêu chuẩn chẩn đoán.", "s": "Không có trong các slide đã gửi, giải thích theo kiến thức chung của môn"}, {"q": "Bệnh nhân tiêm vaccine COVID-19 lần thứ 4, xuất hiện kháng thể kháng huyết thanh và phản ứng Arthus. Đây là quá mẫn loại nào?", "o": ["Type II", "Type III", "Type I", "Type IV"], "a": 1, "e": "Phản ứng Arthus xảy ra khi tiêm nhắc lại nhiều lần. Lúc này cơ thể đã có nhiều kháng thể IgG, kháng nguyên mới tiêm gặp kháng thể tại chỗ tạo phức hợp miễn dịch, lắng đọng ở thành mạch, hoạt hóa bổ thể và kéo neutrophil đến gây viêm, hoại tử. Đây là quá mẫn type III (phức hợp miễn dịch).", "x": "Type I là dị ứng tức thì qua IgE, type II là kháng thể gắn vào tế bào (như truyền sai nhóm máu), type IV là quá mẫn muộn qua tế bào T (như viêm da tiếp xúc).", "s": "Không có trong các slide đã gửi, giải thích theo kiến thức chung của môn"}, {"q": "Hormone do thận sản xuất kích thích tạo hồng cầu là?", "o": ["Renin", "Aldosterone", "Erythropoietin", "Calcitriol"], "a": 2, "e": "Erythropoietin (EPO) do thận sản xuất khi thiếu O2, kích thích tủy xương tạo hồng cầu. Suy thận mạn thiếu EPO gây thiếu máu.", "x": "Renin, aldosterone, calcitriol không kích thích tạo hồng cầu.", "s": "Slide Hội chứng thiếu máu"}, {"q": "Một người đàn ông 80 kg, lượng nước trong toàn bộ tế bào là bao nhiêu?", "o": ["32 L", "48 L", "16 L", "4 L"], "a": 0, "e": "Nam giới có khoảng 60% cân nặng là nước. Nước trong tế bào (nội bào) chiếm khoảng 40% cân nặng: 80 kg × 40% = 32 L. Nước ngoại bào khoảng 20% cân nặng (16 L), trong đó gian bào 15% và nội mạch 5%.", "x": "48 L là tổng lượng nước toàn cơ thể. 16 L là nước ngoại bào. 4 L là nước nội mạch (huyết tương).", "s": "Slide Mất cân bằng muối – nước"}]};

let state={exam:"1",mode:"practice",retry:false,runs:{},t:0};
let qs=[],ans=[],done=false,run=null;
let dbDoc=null,saveTimer=null,saving=false,dirty=false,dbFailed=false;
const LS="onthi_md_slb_v1";

function key(){return state.exam+"-"+state.mode+(state.retry?"-retry":"")}
function getRun(){
  if(state.retry&&!state.runs[key()])state.retry=false;
  const k=key();
  if(!state.runs[k]){state.runs[k]={order:DATA[state.exam].map((_,i)=>i),ans:{},done:false}}
  return state.runs[k];
}
function setSaved(msg){const s=$("saved");if(s)s.textContent=msg}
function lsRead(){try{const v=localStorage.getItem(LS);return v?JSON.parse(v):null}catch(e){return null}}
function lsWrite(){try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}}
function save(){
  state.t=Date.now();lsWrite();dirty=true;
  clearTimeout(saveTimer);saveTimer=setTimeout(flush,700);
}
async function flush(){
  if(!dbDoc||dbFailed){setSaved(dbDoc===null?"Đã lưu trên trình duyệt này":"Đã lưu trên trình duyệt này");return}
  if(saving){saveTimer=setTimeout(flush,400);return}
  if(!dirty)return;
  saving=true;dirty=false;
  try{
    await dbDoc.set(JSON.parse(JSON.stringify(state)));
    setSaved("Đã lưu vào tài khoản");
  }catch(e){
    dbFailed=true;setSaved("Đã lưu trên trình duyệt này (chưa lưu được vào tài khoản)");
  }
  saving=false;
  if(dirty)flush();
}
function adopt(s){
  if(!s||typeof s!=="object"||!s.runs)return false;
  state={exam:s.exam==="2"?"2":"1",mode:s.mode==="exam"?"exam":"practice",retry:!!s.retry,runs:s.runs,t:s.t||0};
  return true;
}
function load(){
  run=getRun();
  const D=DATA[state.exam];
  qs=run.order.filter(id=>D[id]).map(id=>({...D[id],id}));
  ans=qs.map(q=>(run.ans[q.id]!==undefined?run.ans[q.id]:-1));
  done=!!run.done;
  $("e1").setAttribute("aria-pressed",state.exam==="1");
  $("e2").setAttribute("aria-pressed",state.exam==="2");
  $("m1").setAttribute("aria-pressed",state.mode==="practice");
  $("m2").setAttribute("aria-pressed",state.mode==="exam");
  $("retrybar").hidden=!state.retry;
  if(state.retry)$("retrytxt").textContent="Đang làm lại "+qs.length+" câu sai";
  render();
}
function render(){
  const mode=state.mode;
  $("hint").textContent=mode==="practice"
    ?"Chọn đáp án để xem đúng/sai ngay. Tiến độ được lưu tự động."
    :"Chọn đáp án cho cả đề, bấm Nộp bài ở cuối trang để xem điểm và đáp án. Tiến độ được lưu tự động.";
  const list=$("list");list.innerHTML="";
  qs.forEach((q,i)=>{
    const d=document.createElement("div");d.className="q";d.id="q"+i;
    const h=document.createElement("h2");
    h.innerHTML='<span class="n">'+(i+1)+'.</span><span></span>';
    h.lastChild.textContent=q.q;d.appendChild(h);
    const o=document.createElement("div");o.className="opts";
    q.o.forEach((t,k)=>{
      const b=document.createElement("button");b.className="opt";b.type="button";
      b.innerHTML='<span class="l">'+L[k]+'</span><span></span>';
      b.lastChild.textContent=t;
      b.onclick=()=>pick(i,k);
      o.appendChild(b);
    });
    d.appendChild(o);
    const n=document.createElement("div");n.className="note";n.hidden=true;d.appendChild(n);
    list.appendChild(d);
  });
  const g=$("grid");g.innerHTML="";
  qs.forEach((q,i)=>{const a=document.createElement("a");a.textContent=i+1;a.id="g"+i;a.href="#q"+i;
    a.onclick=e=>{e.preventDefault();$("q"+i).scrollIntoView({behavior:"smooth"})};g.appendChild(a)});
  $("submit").style.display=mode==="exam"?"":"none";
  update();
  if(done)showResult(false);else $("result").className="result";
}
function pick(i,k){
  const practice=state.mode==="practice";
  if(done||(practice&&ans[i]>=0))return;
  ans[i]=k;run.ans[qs[i].id]=k;save();update();
}
function update(){
  const reveal=done||state.mode==="practice";
  qs.forEach((q,i)=>{
    const d=$("q"+i),bs=d.querySelectorAll(".opt"),n=d.querySelector(".note");
    const shown=done||(reveal&&ans[i]>=0);
    bs.forEach((b,k)=>{
      b.className="opt";
      if(shown){
        if(k===q.a)b.classList.add("ok");
        else if(k===ans[i])b.classList.add("bad");
        b.disabled=true;
      }else{
        if(k===ans[i])b.classList.add("sel");
        b.disabled=false;
      }
    });
    n.hidden=!shown;
    if(shown){
      n.innerHTML=ans[i]===q.a?"<b>Đúng.</b> Đáp án "+L[q.a]+".":(ans[i]<0?"Chưa chọn. ":"Sai. ")+"Đáp án đúng: <b>"+L[q.a]+"</b>.";
      if(q.e){const w=document.createElement("div");w.className="why";
        const add=(label,t,cls)=>{const p=document.createElement("p");if(cls)p.className=cls;const b=document.createElement("b");b.textContent=label;p.appendChild(b);p.appendChild(document.createTextNode(" "+t));w.appendChild(p)};
        add("Giải thích:",q.e);
        if(q.x)add("Các đáp án khác:",q.x);
        if(q.s)add("Nguồn:",q.s,"src");
        n.appendChild(w)}
    }
    const g=$("g"+i);
    g.className=shown?(ans[i]===q.a?"ok":"bad"):(ans[i]>=0?"done":"");
  });
  const c=ans.filter(x=>x>=0).length;
  $("stat").textContent=c+"/"+qs.length;
  $("bar").style.width=(c/qs.length*100)+"%";
}
function showResult(scroll){
  const s=qs.reduce((t,q,i)=>t+(ans[i]===q.a?1:0),0);
  const r=$("result");r.className="result show";
  r.innerHTML="Điểm: <strong>"+s+"/"+qs.length+"</strong> ("+(s/qs.length*10).toFixed(2)+"/10). Câu sai hoặc bỏ trống đã được đánh dấu đỏ.";
  if(scroll)r.scrollIntoView({behavior:"smooth",block:"center"});
}
function submit(){done=true;run.done=true;save();update();showResult(true)}
function setExam(e){state.exam=e;state.retry=false;save();load();window.scrollTo(0,0)}
function setMode(m){state.mode=m;state.retry=false;save();load();window.scrollTo(0,0)}
$("e1").onclick=()=>setExam("1");$("e2").onclick=()=>setExam("2");
$("m1").onclick=()=>setMode("practice");$("m2").onclick=()=>setMode("exam");
$("submit").onclick=submit;
function msg(t){const r=$("result");r.className="result show";r.textContent=t;r.scrollIntoView({behavior:"smooth",block:"center"})}
$("retry").onclick=()=>{
  if(state.mode==="exam"&&!done){msg("Hãy nộp bài trước, sau đó bấm Làm lại câu sai.");return}
  const wrong=qs.filter((q,i)=>ans[i]!==q.a&&(done||ans[i]>=0)).map(q=>q.id);
  if(!wrong.length){msg("Chưa có câu sai nào để làm lại.");return}
  state.retry=true;
  state.runs[key()]={order:wrong,ans:{},done:false};
  save();load();window.scrollTo(0,0);
};
$("back").onclick=()=>{state.retry=false;save();load();window.scrollTo(0,0)};
$("reset").onclick=()=>{delete state.runs[key()];save();load();window.scrollTo(0,0)};
$("shuf").onclick=()=>{
  const o=getRun().order.slice();
  for(let i=o.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[o[i],o[j]]=[o[j],o[i]]}
  state.runs[key()]={order:o,ans:{},done:false};save();load();window.scrollTo(0,0);
};
// 1) show the browser copy right away
const local=lsRead();
if(local&&adopt(local))setSaved("Đã khôi phục tiến độ từ trình duyệt này");
load();
// 2) then sync with the account copy when available
(async()=>{
  try{
    if(!window.claude||!window.claude.use)return;
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user)return;
    const uid=await user.id();
    if(!uid)return;
    const ref=db.doc("data/users/"+uid+"/progress");
    const snap=await ref.get();
    if(snap.exists){
      const remote=snap.data();
      if(remote&&(remote.t||0)>(state.t||0)&&adopt(remote)){lsWrite();load();setSaved("Đã khôi phục tiến độ từ tài khoản")}
    }
    dbDoc=ref;
    if(dirty||state.t){dirty=true;flush()}
    else setSaved("Tiến độ được lưu vào tài khoản");
  }catch(e){}
})();
</script>

</body>
